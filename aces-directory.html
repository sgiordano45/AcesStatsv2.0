<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="The Aces Directory: fellow members' jobs and skills, and the businesses they recommend.">
<title>Aces Directory - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/directory.css">
</head>
<body class="aces-v2">

<!-- aces-directory.html: Members and Recommendations tabs, signed-in members only (js/pages/directory.js). Your own listing is edited on me.html#directory. -->

<main class="dr aces-container" id="main">
  <header class="aces-page-head">
    <div>
      <span class="aces-page-kicker">Teams &amp; Players</span>
      <h1 class="aces-page-title">Aces Directory</h1>
      <p class="dr-desc">Find fellow Aces by trade or skill, and the local businesses they trust.</p>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-card"><span class="aces-skeleton is-row"></span></div>
    <div class="dr-grid">
      <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span></div>
      <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span></div>
    </div>
  </div>

  <div data-page-content hidden>
    <nav class="aces-tabs dr-tabs" id="drTabs" aria-label="Directory sections"></nav>
    <section id="drMembersTab"></section>
    <section id="drRecsTab" hidden></section>
  </div>
</main>

<script type="module" src="js/pages/directory.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
