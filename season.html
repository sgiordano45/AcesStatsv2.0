<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A Mountainside Aces season: standings, schedule and results, batting and pitching, leaders and awards.">
<title>Season - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/season.css">
</head>
<body class="aces-v2">

<!-- season.html?seasonId=2026-fall&tab=schedule: one season (js/pages/season.js).
     Old links with ?year=2025&season=Fall still work; no season opens the current one. -->

<main class="season aces-container" id="main">
  <header class="aces-page-head sn-head" id="snHead">
    <div>
      <span class="aces-page-kicker">History</span>
      <h1 class="aces-page-title" id="snTitle">Season</h1>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-stats sn-summary">
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
    </div>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
  </div>

  <div data-page-content hidden>
    <div id="snBanner"></div>
    <div class="aces-stats sn-summary" id="snStats"></div>
    <nav class="aces-tabs sn-tabs" id="snTabs" aria-label="Season sections"></nav>
    <section data-tab="overview" id="snOverview"></section>
    <section data-tab="standings" id="snStandings" hidden></section>
    <section data-tab="schedule" id="snSchedule" hidden></section>
    <section data-tab="batting" id="snBatting" hidden></section>
    <section data-tab="pitching" id="snPitching" hidden></section>
    <section data-tab="awards" id="snAwards" hidden></section>
  </div>
</main>

<script type="module" src="js/pages/season.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
