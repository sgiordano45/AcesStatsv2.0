<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="How every Mountainside Aces roster changed from season to season: who stayed, moved, returned, joined and left.">
<title>Roster Tracker - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/roster-tracker.css">
</head>
<body class="aces-v2">

<!-- roster-tracker.html: roster changes between two seasons, and every player's teams over time (js/pages/roster-tracker.js). -->

<main class="rt aces-container" id="main">
  <header class="aces-page-head">
    <div>
      <span class="aces-page-kicker">Teams &amp; Players</span>
      <h1 class="aces-page-title">Roster Tracker</h1>
      <p class="rt-desc">Who stayed, moved, came back, joined and left, season to season.</p>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-card"><span class="aces-skeleton is-row"></span></div>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
  </div>

  <div data-page-content hidden>
    <div class="aces-card rt-controls" id="rtControls"></div>
    <div id="rtChangesView">
      <div class="aces-stats rt-stats" id="rtStats"></div>
      <div class="rt-grid" id="rtChanges"></div>
    </div>
    <div id="rtTimeline" hidden></div>
  </div>
</main>

<script type="module" src="js/pages/roster-tracker.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
