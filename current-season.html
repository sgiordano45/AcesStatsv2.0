<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="The Mountainside Aces season in progress: standings, next games, latest results, playoffs and league leaders.">
<title>Standings - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/current-season.css">
</head>
<body class="aces-v2">

<!-- current-season.html: the season being played (js/pages/current-season.js).
     Past seasons and the full stat tables are on season.html. -->

<main class="cs aces-container" id="main">
  <header class="aces-page-head cs-head">
    <div>
      <span class="aces-page-kicker" id="csKicker">This season</span>
      <h1 class="aces-page-title" id="csTitle">Standings</h1>
      <p class="cs-status" id="csStatus"></p>
    </div>
    <div class="cs-actions">
      <button class="aces-btn is-sm" type="button" data-share><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-share"></use></svg>Share standings</button>
      <button class="aces-btn is-sm" type="button" data-calendar><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-calendar"></use></svg>Add to calendar</button>
      <a class="aces-btn is-sm is-ghost" id="csSeasonLink" href="season.html">Full season</a>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-stats cs-numbers">
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
    </div>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
  </div>

  <div data-page-content hidden>
    <div class="aces-stats cs-numbers" id="csNumbers"></div>
    <div id="csStandings"></div>
    <div class="cs-grid">
      <div id="csNext"></div>
      <div id="csLatest"></div>
    </div>
    <div id="csPlayoffs"></div>
    <div id="csLeaders"></div>
    <div class="cs-grid">
      <div id="csBadges"></div>
      <section class="aces-card cs-card">
        <div class="aces-card-head"><h2 class="aces-card-title">More this season</h2></div>
        <ul class="cs-more">
          <li><a href="projections.html">Playoff seed odds</a><span>How the rest of the season could shake out</span></li>
          <li><a href="admin/playoff-eligibility.html">Playoff eligibility</a><span>Who has played enough games (sign-in needed)</span></li>
          <li><a href="team-stats.html">Team stats</a><span>Every team's batting and pitching</span></li>
          <li><a href="weekend-preview.html">Weekend preview</a><span>This weekend's games and the forecast</span></li>
        </ul>
      </section>
    </div>
  </div>
</main>

<script type="module" src="js/pages/current-season.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
