<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Contributor tools: game previews and odds, eulogies, photos, media and announcements.">
<title>Contributor - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/contributor.css">
</head>
<body class="aces-v2">

<!-- contributor.html: contributor tools, a tab per role (js/pages/contributor.js). -->

<main class="ct aces-container" id="main">
  <header class="aces-page-head">
    <div>
      <span class="aces-page-kicker">Me</span>
      <h1 class="aces-page-title">Contributor</h1>
      <p class="ct-desc">Write previews and eulogies, and manage photos, media and announcements.</p>
      <div class="ct-roles" id="ctRoles"></div>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-card"><span class="aces-skeleton is-row"></span></div>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
  </div>

  <div data-page-content hidden id="ctRoot">
    <nav class="aces-tabs ct-tabs" id="ctTabs" aria-label="Contributor tools"></nav>
    <section id="ct-previews" hidden></section>
    <section id="ct-eulogies" hidden></section>
    <section id="ct-photos" hidden></section>
    <section id="ct-media" hidden></section>
    <section id="ct-banners" hidden></section>
  </div>
</main>

<script type="module" src="js/pages/contributor.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
