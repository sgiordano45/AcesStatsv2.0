<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Latest from the Mountainside Aces: games, milestones, badges, career highs, streaks and photos.">
<title>Activity - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/activity.css">
</head>
<body class="aces-v2">

<!-- activity.html?type=&time=: the league activity feed (js/pages/activity.js). -->

<main class="ac aces-container" id="main">
  <header class="aces-page-head ac-head">
    <div>
      <span class="aces-page-kicker">League</span>
      <h1 class="aces-page-title">Activity</h1>
      <p class="ac-lede">Games, milestones, badges, career highs, streaks and photos from across the league.</p>
    </div>
    <div class="ac-actions">
      <button type="button" class="aces-btn is-sm" data-digest><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-clipboard"></use></svg>Milestone digest</button>
    </div>
  </header>

  <div class="ac-filters">
    <div class="aces-chip-row ac-types" id="acTypes" role="group" aria-label="Type"></div>
    <div class="aces-segmented ac-times" id="acTimes" role="group" aria-label="Time"></div>
  </div>

  <div id="acFeed" aria-live="polite">
    <div class="aces-card"><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
  </div>
  <div class="ac-more" id="acMore" hidden></div>
</main>

<script type="module" src="js/pages/activity.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
