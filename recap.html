<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A Mountainside Aces year in review: champions, standings, leaders, awards, rookies and milestones.">
<title>Year in Review - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/recap.css">
</head>
<body class="aces-v2">

<!-- recap.html: one year in review, each season in turn (js/pages/recap.js). ?year=2025 -->

<main class="rc aces-container" id="main">
  <header class="aces-page-head rc-head">
    <div>
      <span class="aces-page-kicker">History</span>
      <h1 class="aces-page-title" id="rcTitle">Year in Review</h1>
      <p class="rc-desc">Champions, standings, leaders, awards, rookies and milestones, season by season.</p>
    </div>
    <nav class="aces-segmented rc-years" id="rcYears" aria-label="Year"></nav>
  </header>

  <div data-page-loading>
    <div class="aces-stats rc-tiles">
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
    </div>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
  </div>

  <div data-page-content hidden>
    <div class="rc-body" id="rcBody" aria-live="polite"></div>
  </div>
</main>

<script type="module" src="js/pages/recap.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
