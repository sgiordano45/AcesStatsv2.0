<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<!-- PWA Session Persistence - Save current page for restore after app kill -->
<script>
(function(){try{var p=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;if(p){var c=window.location.pathname+window.location.search;if(!/\/(index\.html)?$/.test(c)){localStorage.setItem('pwa_last_page',c);localStorage.setItem('pwa_last_page_ts',Date.now().toString())}}}catch(e){}})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Tracker - Mountainside Aces</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/game-tracker.css">
</head>
<body>

<!-- game-tracker-v2.html: the Game Tracker without Babel. Same app as
     game-tracker.html (js/features/game-tracker/app.js, JSX rewritten as htm
     templates) and the same Firebase code (bridge.js). Runs beside the live
     page until it has been proven on a real game. -->

<div id="connectionStatus" class="connection-status hidden">
  <span class="status-icon">&#x1F4E1;</span>
  <span class="status-text">You're offline</span>
</div>
<div id="root"></div>

<!-- Order matters: bridge.js (module) and app.js (defer) run in this order. -->
<script type="module" src="js/features/game-tracker/bridge.js"></script>
<script defer src="js/features/game-tracker/app.js"></script>
<script type="module" src="offline-queue.js"></script>
<script src="theme-toggle.js"></script>
</body>
</html>
