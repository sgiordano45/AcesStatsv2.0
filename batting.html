<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batting Statistics - Mountainside Aces</title>
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="nav-styles.css">
<link rel="stylesheet" href="dark-mode.css">
<style>
:root {
  --primary-color: #2d5016;
  --secondary-color: #1a6b4a;
  --accent-color: #ffd700;
  --card-bg: #ffffff;
  --text-dark: #2d3748;
  --text-light: #718096;
  --border-color: #e2e8f0;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.16);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
  min-height: 100vh;
  color: var(--text-dark);
}

/* Loading Overlay */
.loading-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.3s ease;
}

.loading-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

.softball-spinner::before {
  content: '⚾';
  font-size: 80px;
  animation: spin 1.5s ease-in-out infinite;
}

@keyframes spin {
  0%, 100% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(180deg) scale(1.1); }
}

/* Header */
.page-header {
  background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
  padding: 4rem 2rem;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
  color: white;
  text-align: center;
}

.page-header::before {
  content: '';
  position: absolute;
  top: -50px;
  right: -50px;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
  border-radius: 50%;
}

.page-header::after {
  content: '⚾';
  position: absolute;
  bottom: -30px;
  left: -30px;
  font-size: 200px;
  opacity: 0.05;
}

.page-header h1 {
  font-size: 3.5rem;
  font-weight: 800;
  margin-bottom: 1rem;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  position: relative;
  z-index: 1;
}

.page-header p {
  font-size: 1.3rem;
  font-weight: 300;
  opacity: 0.9;
  position: relative;
  z-index: 1;
}

/* Dashboard Container */
.page-container {
  max-width: 1400px;
  margin: 3rem auto;
  padding: 0 2rem;
}

/* Summary Section */
.summary {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 2rem;
  margin-bottom: 2rem;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
  position: relative;
}

.summary::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 5px;
  background: linear-gradient(90deg, var(--primary-color) 0%, var(--secondary-color) 100%);
  border-radius: 16px 16px 0 0;
}

.summary p {
  margin: 0 0 1rem 0;
  color: var(--text-dark);
  font-size: 1rem;
  line-height: 1.6;
}

.summary p:last-child {
  margin-bottom: 0;
}

#loadingIndicator {
  text-align: center;
  padding: 2rem;
}

#loadingIndicator p:first-child {
  font-size: 1.2rem;
  color: var(--primary-color);
  font-weight: 600;
}

#loadingIndicator p:last-child {
  color: var(--text-light);
  margin-top: 0.5rem;
  font-size: 0.9rem;
}

/* Filters and Navigation Section */
.filters-nav {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 2rem;
  margin-bottom: 2rem;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
  position: relative;
}

.filters-nav::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 5px;
  background: linear-gradient(90deg, var(--primary-color) 0%, var(--secondary-color) 100%);
  border-radius: 16px 16px 0 0;
}

.filters-section {
  display: flex;
  flex-wrap: wrap;
  gap: 1.5rem;
  align-items: center;
  margin-bottom: 1.5rem;
}

.filters-section > div {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.filters-section label {
  font-weight: 600;
  color: var(--text-dark);
}

.filters-section select {
  padding: 0.6rem 1.2rem;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: white;
  color: var(--text-dark);
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s ease;
}

.filters-section select:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px rgba(45,80,22,0.1);
}

/* Navigation Buttons */
.nav-container {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
}

.nav-link {
  padding: 0.8rem 1.5rem;
  border: 2px solid var(--primary-color);
  background: white;
  color: var(--primary-color);
  text-decoration: none;
  border-radius: 12px;
  font-weight: 600;
  font-size: 1rem;
  transition: all 0.3s ease;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  position: relative;
  overflow: hidden;
  cursor: pointer;
}

.nav-link::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--primary-color);
  transform: translateX(-100%);
  transition: transform 0.3s ease;
  z-index: -1;
}

.nav-link:hover::before {
  transform: translateX(0);
}

.nav-link:hover {
  color: white;
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.nav-link.pitching {
  border-color: #11998e;
  color: #11998e;
}

.nav-link.pitching::before {
  background: #11998e;
}

.nav-link.active {
  background: var(--primary-color);
  color: white;
}

.nav-link.batting.active {
  background: var(--primary-color);
}

@media (max-width: 768px) {
  .page-header h1 {
    font-size: 2.5rem;
  }
  
  .page-header p {
    font-size: 1.1rem;
  }
  
  .page-container {
    padding: 0 1rem;
    margin: 2rem auto;
  }
  
  .summary, .filters-nav {
    padding: 1.5rem;
  }
  
  .filters-section {
    flex-direction: column;
    align-items: stretch;
    gap: 1rem;
  }
  
  .filters-section > div {
    flex-direction: column;
    align-items: stretch;
  }
  
  .filters-section select {
    width: 100%;
  }
  
  .nav-container {
    flex-direction: column;
  }
  
  .nav-link {
    width: 100%;
    justify-content: center;
  }
  
  .mobile-nav-container {
    display: block;
  }
}

@media (max-width: 480px) {
  .page-header {
    padding: 3rem 1rem;
  }
  
  .page-header h1 {
    font-size: 2rem;
  }
  
}

/* The stat table sits in a card like the summary and filters. */
.batting-table {
  margin-top: 1.5rem;
}
</style>
</head>
<body>
<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay" data-page-loading>
  <div class="softball-spinner"></div>
</div>


<!-- Header -->
<div class="page-header">
  <h1>Mountainside Aces Batting Stats</h1>
  <p>Complete batting statistics and performance metrics for all players</p>
</div>

<!-- Main Content -->
<div class="page-container">
  <!-- Summary Section -->
  <div id="summary" class="summary">
    <div id="loadingIndicator" data-page-loading>
      <p style="font-size: 1.2rem; color: var(--primary-color);">⏳ Loading batting statistics...</p>
      <p style="color: var(--text-light); margin-top: 0.5rem;">Using optimized aggregated collection (fast!)</p>
    </div>
    <div data-page-content hidden>
      <p id="totalsText"></p>
      <p id="leadersText"></p>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters-nav">
    <div class="filters-section">
      <div>
        <label for="seasonFilter">Season:</label>
        <select id="seasonFilter">
          <option value="all">All seasons</option>
        </select>
      </div>
      <div>
        <label for="teamFilter">Team:</label>
        <select id="teamFilter">
          <option value="all">All teams</option>
        </select>
      </div>
      <div>
        <label for="subsFilter">Subs:</label>
        <select id="subsFilter">
          <option value="include">Include sub games</option>
          <option value="exclude">Exclude sub games</option>
          <option value="only">Sub games only</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Statistics Table (js/ui/table.js) -->
  <div id="battingTable" class="batting-table"></div>
</div>

<script src="team-colors.js"></script>
<script type="module">
  // firebase-data.js first: its firebase-config.js creates the Firebase app,
  // and js/core/firebase.js (loaded through app.js) reuses it.
  import { getAllPlayerStatsOptimized, seasonsObjectToArray } from './firebase-data.js';
  import { getSeasonGames } from './js/data/games.js';
  import { initPage, pageReady, showPageState, showPageError } from './js/core/app.js';
  import { capitalize, formatPlayerName, escapeHtml as esc, fmtAvg, fmtRate, playerUrl, teamUrl } from './js/ui/format.js';
  import { battingLine, QUALIFIERS, isQualifiedBatter, qualifierLabel } from './js/domain/stats.js';
  import { normalizeGames, isDecided } from './js/domain/standings.js';
  import { mountStatTable } from './js/ui/table.js';
  import { sumFields } from './js/ui/table-model.js';

  const SEASON_ORDER = { spring: 1, summer: 2, fall: 3 };
  const COUNT_FIELDS = ['games', 'atBats', 'hits', 'runs', 'walks', 'doubles', 'triples', 'homeRuns', 'rbi'];
  const TEAM_COLORS = new Set(['black', 'green', 'red', 'blue', 'white', 'orange', 'silver', 'purple', 'gold', 'carolina', 'army', 'teal']);

  let allRows = [];          // one row per player-season (the page's own filters apply on top)
  let table = null;
  let seasons = [];          // [{ id, year, name, label, key }] newest first
  let defaultSeason = 'all';

  // ---- rows ----------------------------------------------------------------

  // Stored season IDs can carry a team and sub suffix ('2024-fall-gold-sub');
  // the season is the first two parts.
  function parseSeasonId(raw) {
    const parts = String(raw || '').toLowerCase().split('-');
    const year = parts[0] || '';
    const name = parts[1] || '';
    return { id: year && name ? `${year}-${name}` : '', year, name, isSubId: parts.includes('sub') };
  }

  const seasonLabel = (s) => `${s.year} ${capitalize(s.name)}`;
  const seasonKey = (s) => (Number(s.year) || 0) * 10 + (SEASON_ORDER[s.name] || 0);
  const numOrNull = (v) => (typeof v === 'number' && Number.isFinite(v) ? v : (v !== null && v !== '' && v !== 'N/A' && Number.isFinite(Number(v)) ? Number(v) : null));

  function buildRows(players) {
    const rows = [];
    for (const player of players) {
      if (!player.seasons || typeof player.seasons !== 'object') continue;
      for (const s of seasonsObjectToArray(player)) {
        const sid = parseSeasonId(s.seasonId);
        if (!sid.id) continue;
        const team = capitalize(String(s.team || player.currentTeam || '').toLowerCase());
        const row = {
          id: player.userId || player.id || '',
          ids: [player.userId, player.id, player.playerId].filter(Boolean),
          name: formatPlayerName(player.name || player.displayName || player.userId),
          team,
          teamKey: team.toLowerCase(),
          seasonId: sid.id,
          seasonLabel: seasonLabel(sid),
          seasonKey: seasonKey(sid),
          seasonCount: 1,
          sub: sid.isSubId || /^yes$/i.test(String(s.sub || '')),
          hasHitTypes: 'doubles' in s,
          acesBPI: s.sub && /^yes$/i.test(String(s.sub)) ? null : numOrNull(s.acesBPI),
          bwar: numOrNull(s.bwarSimp),
          teamGames: null
        };
        for (const f of COUNT_FIELDS) row[f] = Number(s[f]) || 0;
        rows.push(row);
      }
    }
    // Newest season first, then team, then name: ties in any sort keep this order.
    rows.sort((a, b) => b.seasonKey - a.seasonKey || a.team.localeCompare(b.team) || a.name.localeCompare(b.name));
    return rows;
  }

  // Team games per season from the game docs: every decided game, playoffs
  // included (season stats include playoff games). A team with no game docs
  // falls back to the most games any of its players logged.
  async function attachTeamGames(rows) {
    const ids = [...new Set(rows.map(r => r.seasonId))];
    const results = await Promise.allSettled(ids.map(id => getSeasonGames(id)));
    const counts = new Map();   // 'seasonId|team' -> games
    results.forEach((res, i) => {
      if (res.status !== 'fulfilled') { console.warn('[batting] games for', ids[i], res.reason); return; }
      for (const g of normalizeGames(res.value)) {
        if (!isDecided(g)) continue;
        for (const t of [g.home, g.away]) {
          const k = `${ids[i]}|${String(t).toLowerCase()}`;
          counts.set(k, (counts.get(k) || 0) + 1);
        }
      }
    });
    const maxPlayer = new Map();
    for (const r of rows) {
      const k = `${r.seasonId}|${r.teamKey}`;
      maxPlayer.set(k, Math.max(maxPlayer.get(k) || 0, r.games));
    }
    for (const r of rows) {
      const k = `${r.seasonId}|${r.teamKey}`;
      r.teamGames = counts.get(k) || maxPlayer.get(k) || 0;
    }
  }

  // ---- table config ----------------------------------------------------------

  const line = (r) => battingLine(r);
  const avg = (v) => (v === null || v === undefined ? '-' : fmtAvg(v));
  const allHitTypes = (rows) => rows.length > 0 && rows.every(r => r.hasHitTypes);

  const config = {
    id: '',
    cardSub: 'team',
    columns: [
      { key: 'name', label: 'Player', type: 'text', value: r => r.name,
        html: r => `<a href="${esc(playerUrl({ id: r.id, name: r.name }))}">${esc(r.name)}</a>` },
      { key: 'team', label: 'Team', type: 'text', value: r => r.team,
        html: r => {
          if (r.team === 'Multiple') return 'Multiple';
          const color = TEAM_COLORS.has(r.teamKey) ? ` data-team-color="${esc(r.teamKey)}"` : '';
          const season = r.seasonCount === 1 ? r.seasonId : undefined;
          return `<a class="aces-team-chip"${color} href="${esc(teamUrl(r.team, { season }))}"><span class="aces-team-dot"></span>${esc(r.team)}</a>`;
        } },
      { key: 'season', label: 'Season', type: 'text', defaultDir: 'desc', value: r => r.seasonKey,
        format: (v, r) => r.seasonLabel, csv: r => r.seasonLabel },
      { key: 'G', label: 'G', title: 'Games', type: 'count', value: r => r.games, perGame: false },
      { key: 'PA', label: 'PA', title: 'Plate appearances (AB + BB)', type: 'count', value: r => r.atBats + r.walks },
      { key: 'AB', label: 'AB', type: 'count', value: r => r.atBats },
      { key: 'H', label: 'H', title: 'Hits', type: 'count', value: r => r.hits },
      { key: '2B', label: '2B', title: 'Doubles', type: 'count', value: r => r.doubles, when: allHitTypes },
      { key: '3B', label: '3B', title: 'Triples', type: 'count', value: r => r.triples, when: allHitTypes },
      { key: 'HR', label: 'HR', title: 'Home runs', type: 'count', value: r => r.homeRuns, when: allHitTypes },
      { key: 'R', label: 'R', title: 'Runs', type: 'count', value: r => r.runs },
      { key: 'RBI', label: 'RBI', type: 'count', value: r => r.rbi, when: allHitTypes },
      { key: 'BB', label: 'BB', title: 'Walks', type: 'count', value: r => r.walks },
      { key: 'BA', label: 'BA', type: 'rate', value: r => (r.atBats ? line(r).avg : null), format: avg },
      { key: 'OBP', label: 'OBP', type: 'rate', value: r => (r.atBats + r.walks ? line(r).obp : null), format: avg },
      { key: 'SLG', label: 'SLG', title: 'Slugging (2026 on)', type: 'rate', value: r => (r.atBats ? line(r).slg : null), format: avg, when: allHitTypes },
      { key: 'OPS', label: 'OPS', title: 'OBP + SLG (2026 on)', type: 'rate', value: r => (r.atBats ? line(r).ops : null), format: avg, when: allHitTypes },
      { key: 'RPA', label: 'R/PA', title: 'Runs per plate appearance', type: 'rate', value: r => (r.atBats + r.walks ? line(r).runsPerPA : null), format: avg },
      { key: 'BPI', label: 'AcesBPI', type: 'rate', qualifiedOnly: false, value: r => r.acesBPI, format: v => fmtRate(v) },
      { key: 'bWAR', label: 'bWAR', type: 'rate', qualifiedOnly: false, value: r => r.bwar, format: v => fmtRate(v) },
      { key: 'sub', label: 'Sub', type: 'text', shade: false, value: r => (r.sub ? 'Yes' : ''), format: v => v || '' }
    ],
    presets: [
      { key: 'standard', label: 'Standard', sort: '-H', card: ['G', 'H', 'BA', 'OBP'],
        columns: ['name', 'team', 'season', 'G', 'AB', 'H', 'R', 'BB', 'BA', 'OBP', 'BPI', 'bWAR', 'sub'] },
      { key: 'advanced', label: 'Advanced', sort: '-OBP', card: ['BA', 'OBP', 'RPA', 'BPI'],
        columns: ['name', 'team', 'season', 'PA', 'BA', 'OBP', 'SLG', 'OPS', 'RPA', 'BPI', 'bWAR'] },
      { key: 'counting', label: 'Counting', sort: '-H', card: ['G', 'H', 'R', 'BB'],
        columns: ['name', 'team', 'season', 'G', 'PA', 'AB', 'H', '2B', '3B', 'HR', 'R', 'RBI', 'BB'] }
    ],
    games: r => r.games,
    qualifier: (state) => state.combine
      ? { label: `min ${QUALIFIERS.CAREER_MIN_PA} PA combined`, test: r => r.atBats + r.walks >= QUALIFIERS.CAREER_MIN_PA }
      : { label: qualifierLabel('batting').replace(/^Min/, 'min'), test: r => r.teamGames > 0 && isQualifiedBatter(r, r.teamGames) },
    combine: {
      label: 'Combine seasons',
      key: r => r.id || r.name,
      merge: (group) => {
        const first = group[0];
        // Team comes from the regular (non-sub) rows: someone who only played for
        // Green but subbed for others shows as Green. All-sub groups use their sub teams.
        const regular = group.filter(r => !r.sub);
        const teams = new Set((regular.length ? regular : group).map(r => r.team));
        const seasonIds = new Set(group.map(r => r.seasonId));
        const bwars = group.map(r => r.bwar).filter(v => v !== null);
        return {
          ...first,
          ...sumFields(group, COUNT_FIELDS),
          team: teams.size > 1 ? 'Multiple' : [...teams][0],
          teamKey: teams.size > 1 ? 'multiple' : String([...teams][0] || '').toLowerCase(),
          seasonCount: seasonIds.size,
          seasonKey: Math.max(...group.map(r => r.seasonKey)),
          seasonLabel: seasonIds.size > 1 ? `${seasonIds.size} seasons` : first.seasonLabel,
          sub: group.every(r => r.sub),
          hasHitTypes: group.every(r => r.hasHitTypes),
          acesBPI: null,                                   // a season score; it doesn't add up
          bwar: bwars.length ? bwars.reduce((a, b) => a + b, 0) : null,
          teamGames: sumFields(group, ['teamGames']).teamGames
        };
      }
    }
  };

  // ---- page filters: season (or a whole year) and team, kept in the URL --------

  const $ = (id) => document.getElementById(id);

  function readFilters() {
    const p = new URLSearchParams(location.search);
    return { season: p.get('season') || defaultSeason, team: p.get('team') || 'all', subs: p.get('subs') || 'include' };
  }

  function writeFilters({ season, team, subs }) {
    const p = new URLSearchParams(location.search);
    if (season && season !== defaultSeason) p.set('season', season); else p.delete('season');
    if (team && team !== 'all') p.set('team', team); else p.delete('team');
    if (subs && subs !== 'include') p.set('subs', subs); else p.delete('subs');
    const qs = p.toString();
    history.replaceState(history.state, '', `${location.pathname}${qs ? `?${qs}` : ''}${location.hash}`);
  }

  function inSeason(r, season) {
    if (!season || season === 'all') return true;
    if (season.startsWith('y:')) return r.seasonId.startsWith(season.slice(2) + '-');
    return r.seasonId === season;
  }

  function fillSeasonSelect() {
    const byYear = new Map();
    for (const s of seasons) {
      if (!byYear.has(s.year)) byYear.set(s.year, []);
      byYear.get(s.year).push(s);
    }
    $('seasonFilter').innerHTML = '<option value="all">All seasons</option>' +
      [...byYear].map(([year, list]) => `<optgroup label="${esc(year)}">` +
        (list.length > 1 ? `<option value="y:${esc(year)}">All ${esc(year)}</option>` : '') +
        list.map(s => `<option value="${esc(s.id)}">${esc(s.label)}</option>`).join('') + '</optgroup>').join('');
  }

  function fillTeamSelect(season, team) {
    const teams = [...new Set(allRows.filter(r => inSeason(r, season)).map(r => r.team))].filter(Boolean).sort();
    if (team !== 'all' && !teams.some(t => t.toLowerCase() === team)) teams.push(capitalize(team));
    $('teamFilter').innerHTML = '<option value="all">All teams</option>' +
      teams.map(t => `<option value="${esc(t.toLowerCase())}">${esc(t)}</option>`).join('');
  }

  function applyFilters() {
    const f = { season: $('seasonFilter').value, team: $('teamFilter').value, subs: $('subsFilter').value };
    const subsOk = (r) => (f.subs === 'exclude' ? !r.sub : f.subs === 'only' ? r.sub : true);
    const rows = allRows.filter(r => inSeason(r, f.season) && (f.team === 'all' || r.teamKey === f.team) && subsOk(r));
    table.setRows(rows);
    updateSummary(rows);
    return f;
  }

  function onFilterChange(e) {
    if (e.target.id === 'seasonFilter') fillTeamSelect($('seasonFilter').value, $('teamFilter').value);
    writeFilters(applyFilters());
  }

  // ---- summary ---------------------------------------------------------------

  function updateSummary(rows) {
    const totalsText = $('totalsText');
    const leadersText = $('leadersText');
    if (!rows.length) { totalsText.textContent = 'No stats for this selection'; leadersText.textContent = ''; return; }
    const n = (v) => v.toLocaleString('en-US');
    const sum = (f) => rows.reduce((s, r) => s + r[f], 0);
    const players = new Set(rows.map(r => r.id || r.name)).size;
    totalsText.textContent = `${n(players)} players | ${n(sum('games'))} games | ${n(sum('atBats'))} at bats | ${n(sum('hits'))} hits | ${n(sum('runs'))} runs | ${n(sum('walks'))} walks`;

    // All-time single-season leaders (every season, not just the selection).
    const best = (list, f) => list.reduce((m, r) => (f(r) > f(m) ? r : m), list[0]);
    const rated = allRows.filter(r => r.atBats >= QUALIFIERS.ALL_TIME_MIN_AB);
    const bpi = allRows.filter(r => r.acesBPI !== null);
    const parts = [
      ['Games', best(allRows, r => r.games), r => r.games],
      ['At Bats', best(allRows, r => r.atBats), r => r.atBats],
      ['Hits', best(allRows, r => r.hits), r => r.hits],
      ['Runs', best(allRows, r => r.runs), r => r.runs],
      ['Walks', best(allRows, r => r.walks), r => r.walks],
      rated.length && ['BA', best(rated, r => r.hits / r.atBats), r => fmtAvg(r.hits / r.atBats)],
      rated.length && ['OBP', best(rated, r => line(r).obp), r => fmtAvg(line(r).obp)],
      bpi.length && ['AcesBPI', best(bpi, r => r.acesBPI), r => fmtRate(r.acesBPI)]
    ].filter(Boolean);
    leadersText.textContent = 'All-Time Single Season Leaders — ' +
      parts.map(([label, r, val]) => `${label}: ${r.name} (${val(r)}, ${r.seasonLabel})`).join(' | ');
  }

  // ---- start -------------------------------------------------------------------

  async function main() {
    const ctx = await initPage({ title: 'Batting Statistics' });
    // The signed-in player's rows get the gold "you" highlight (View As aware).
    const me = new Set([ctx?.profile?.linkedPlayer, ctx?.profile?.playerId, ctx?.user?.uid].filter(Boolean));

    table = mountStatTable($('battingTable'), config, {
      emptyMessage: 'No batting stats for this selection.',
      exportName: 'aces-batting',
      exportTitle: 'Aces batting',
      rowClass: r => (me.size && r.ids.some(id => me.has(id)) ? 'is-me' : '')
    });

    const players = await getAllPlayerStatsOptimized();
    if (!players || players.length === 0) {
      showPageState({ title: 'No batting stats yet', message: 'Stats show up here once games have been entered.', container: '#summary' });
      return;
    }
    allRows = buildRows(players);

    const seen = new Map();
    for (const r of allRows) if (!seen.has(r.seasonId)) seen.set(r.seasonId, { id: r.seasonId, year: r.seasonId.split('-')[0], label: r.seasonLabel, key: r.seasonKey });
    seasons = [...seen.values()].sort((a, b) => b.key - a.key);

    // Default: the current season (siteConfig/current), else the newest with stats.
    const current = ctx?.config?.phase !== 'offseason' ? ctx?.config?.currentSeasonId : null;
    defaultSeason = (current && seen.has(current)) ? current : (seasons[0]?.id || 'all');

    fillSeasonSelect();
    const f = readFilters();
    $('seasonFilter').value = [...$('seasonFilter').options].some(o => o.value === f.season) ? f.season : defaultSeason;
    fillTeamSelect($('seasonFilter').value, f.team);
    $('teamFilter').value = [...$('teamFilter').options].some(o => o.value === f.team) ? f.team : 'all';
    $('seasonFilter').addEventListener('change', onFilterChange);
    $('teamFilter').addEventListener('change', onFilterChange);
    $('subsFilter').value = ['include', 'exclude', 'only'].includes(f.subs) ? f.subs : 'include';
    $('subsFilter').addEventListener('change', onFilterChange);

    applyFilters();
    pageReady();

    // Team games (for Qualified) load after the table is up.
    try {
      await attachTeamGames(allRows);
      table.refresh();
    } catch (err) {
      console.warn('[batting] team games unavailable; Qualified shows no one', err);
    }
  }

  main().catch((err) => showPageError(err, { container: '#summary' }));
</script>

<script src="mobile-enhancements.js"></script>
<script src="stat-tooltips.js"></script>
</body>
</html>
