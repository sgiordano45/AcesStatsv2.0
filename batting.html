<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Batting stats for every Mountainside Aces player, by season, team or all-time.">
<title>Batting - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/stat-page.css">
</head>
<body class="aces-v2" data-kind="batting">

<!-- batting.html: every player's batting stats (js/pages/stat-page.js, shared with pitching.html). -->

<main class="sp aces-container" id="main">
  <header class="aces-page-head sp-head">
    <div>
      <span class="aces-page-kicker">Stats</span>
      <h1 class="aces-page-title">Batting</h1>
    </div>
    <div class="sp-links">
      <a class="aces-btn is-sm is-ghost" href="leaders.html"><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-trophy"></use></svg>Leaders</a>
      <a class="aces-btn is-sm is-ghost" href="explore.html"><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-search"></use></svg>Explore</a>
    </div>
  </header>

  <nav class="aces-tabs sp-tabs" aria-label="Stats">
    <a class="aces-tab" href="batting.html" aria-current="page"><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-bat"></use></svg><span>Batting</span></a>
    <a class="aces-tab" href="pitching.html"><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-softball"></use></svg><span>Pitching</span></a>
  </nav>

  <section class="aces-card sp-filters" aria-label="Filters">
    <label class="sp-filter"><span class="aces-label">Season</span>
      <span class="aces-select-wrap"><select class="aces-select" id="seasonFilter"><option value="all">All seasons</option></select></span></label>
    <label class="sp-filter"><span class="aces-label">Team</span>
      <span class="aces-select-wrap"><select class="aces-select" id="teamFilter"><option value="all">All teams</option></select></span></label>
    <label class="sp-filter"><span class="aces-label">Subs</span>
      <span class="aces-select-wrap"><select class="aces-select" id="subsFilter">
        <option value="include">Include sub games</option>
        <option value="exclude">Exclude sub games</option>
        <option value="only">Sub games only</option>
      </select></span></label>
  </section>

  <div id="spBody">
    <div data-page-loading>
      <div class="aces-stats sp-totals">
        <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
        <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
        <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
        <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      </div>
      <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
    </div>
    <div data-page-content hidden>
      <div class="aces-stats sp-totals" id="spTotals" aria-live="polite"></div>
      <section class="aces-card sp-card sp-table-card"><div id="spTable"></div></section>
      <div id="spRecords"></div>
    </div>
  </div>
</main>

<script type="module" src="js/pages/stat-page.js"></script>
<script src="mobile-enhancements.js"></script>
<script src="stat-tooltips.js"></script>
</body>
</html>
