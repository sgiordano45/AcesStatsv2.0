import { onAuthChange, getCurrentUser, getUserProfile } from './firebase-auth.js';
// import { isImpersonating, getImpersonatedUser, injectImpersonationBanner } from './admin-impersonate.js';
import {
  getCurrentSeason,
  getAllTeams
} from './firebase-data.js';
import {
  getGameRSVPs,
  updateRSVP,
  listenToGameRSVPs,
  getBattingOrder,
  saveBattingOrder,
  getFieldingPositions,
  saveFieldingPositions,

  unfinalizeBattingOrder,
  finalizeFieldingPositions,
  unfinalizeFieldingPositions
} from './firebase-roster.js';

import { onForegroundMessage } from './firebase-messaging.js';

// Expose Firebase functions for finalization status checks
import { doc, getDoc, setDoc, deleteDoc, collection, query, where, orderBy, limit, getDocs, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
import { db } from './firebase-data.js';

window.firebaseImports = { doc, getDoc, setDoc, deleteDoc, db, collection, query, where, orderBy, limit, getDocs, serverTimestamp };


let rsvpListeners = [];
let appInitialized = false;

// ADD THIS: Listen for foreground notifications
onForegroundMessage((payload) => {
  console.log('📬 Notification received:', payload);
  
  // Show visual notification in the page
  showInPageNotification(payload);
  
  // Reload data if it's relevant to this page
  if (payload.data.type === 'lineup_posted') {
    // Trigger a refresh of the lineup data
    console.log('🔄 Lineup updated, refreshing data...');
    if (window.location.reload) {
      setTimeout(() => {
        window.location.reload();
      }, 2000); // Give user time to see the notification
    }
  } else if (payload.data.type === 'rsvp_update') {
    console.log('🔄 RSVP updated');
    // Could trigger a specific RSVP refresh here
  }
});

// Helper function to show in-page notification
function showInPageNotification(payload) {
  // Check if notification already exists
  const existingNotif = document.getElementById('inPageNotification');
  if (existingNotif) {
    existingNotif.remove();
  }
  
  const notification = document.createElement('div');
  notification.id = 'inPageNotification';
  notification.style.cssText = `
    position: fixed;
    top: 20px;
    right: 20px;
    background: white;
    padding: 16px 20px;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    z-index: 10000;
    max-width: 350px;
    animation: slideInRight 0.3s ease-out;
    border-left: 4px solid #2d5016;
  `;
  
  notification.innerHTML = `
    <div style="display: flex; align-items: start; gap: 12px;">
      <div style="font-size: 24px;">🔔</div>
      <div style="flex: 1;">
        <div style="font-weight: 600; color: #2d3748; margin-bottom: 4px;">
          ${payload.notification.title}
        </div>
        <div style="color: #718096; font-size: 14px;">
          ${payload.notification.body}
        </div>
      </div>
      <button onclick="this.parentElement.parentElement.remove()" 
              style="background: none; border: none; color: #718096; cursor: pointer; font-size: 20px; padding: 0; line-height: 1;">
        ×
      </button>
    </div>
  `;
  
  document.body.appendChild(notification);
  
  // Auto-remove after 5 seconds
  setTimeout(() => {
    if (notification.parentElement) {
      notification.style.animation = 'slideOutRight 0.3s ease-out';
      setTimeout(() => notification.remove(), 300);
    }
  }, 5000);
}

// Add animation styles if not present
if (!document.getElementById('notification-animations')) {
  const styles = document.createElement('style');
  styles.id = 'notification-animations';
  styles.textContent = `
    @keyframes slideInRight {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    @keyframes slideOutRight {
      from {
        transform: translateX(0);
        opacity: 1;
      }
      to {
        transform: translateX(400px);
        opacity: 0;
      }
    }
  `;
  document.head.appendChild(styles);
}

async function initializeApp(user) {
  if (!user) {
    window.location.href = 'signin.html';
    return;
  }
  
  if (appInitialized) {
    console.log('⚠️ App already initialized, skipping');
    return;
  }
  
  console.log('🚀 Initializing app for user:', user.displayName);
  
  document.getElementById('loadingOverlay').classList.add('hidden');
  
  const container = document.getElementById('root');
  const root = ReactDOM.createRoot(container);
  root.render(React.createElement(RosterManagement, { currentUser: user }));
  
  appInitialized = true;
}

onAuthChange((user) => {
  console.log('🔐 Auth state changed:', user ? user.displayName : 'No user');
  if (user) {
    initializeApp(user);
  } else {
    window.location.href = 'signin.html';
  }
});

window.FirebaseRoster = {
  getGameRSVPs,
  updateRSVP,
  listenToGameRSVPs,
  getBattingOrder,
  saveBattingOrder,
  getFieldingPositions,
  saveFieldingPositions,
  getBenchPlayers,
  saveBenchPlayers,
  getUpcomingTeamGames,
  getTeamRosterDoc,
  getCurrentSeason,
  getAllTeams,
  getUserProfile,
  finalizeBattingOrder,
  unfinalizeBattingOrder,
  finalizeFieldingPositions,
  unfinalizeFieldingPositions,
  getPlayerSeasonAvg: async function(playerId, legacyId, seasonId) {
    const lookupIds = [playerId, legacyId].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i);
    for (const id of lookupIds) {
      const snap = await getDoc(doc(db, 'aggregatedPlayerStats', id));
      if (snap.exists()) {
        const data = snap.data();
        if (data.migrated) break;
        const key = Object.keys(data.seasons || {}).find(k => k.startsWith(seasonId) && !k.endsWith('-sub'));
        if (key) {
          const s = data.seasons[key];
          const avg = s.battingAverage ?? (s.atBats > 0 ? s.hits / s.atBats : 0);
          return typeof avg === 'number' ? avg.toFixed(3) : '.000';
        }
        break;
      }
    }
    return '.000';
  }
};

    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </svg>

const SEASONS = {
  fall: { name: 'Fall', minPlayers: 7, catcherMinPlayers: 9, maxRoster: 14, battingOrderSize: 14, 
         positions: ['P', 'C', '1B', '2B', '3B', 'SS', 'LF', 'CF', 'RF'] },
  summer: { name: 'Summer', minPlayers: 8, catcherMinPlayers: 10, maxRoster: 17, battingOrderSize: 17,
           positions: ['P', 'C', '1B', '2B', '3B', 'SS', 'LF', 'LCF', 'RCF', 'RF'] }
};

const RSVP_STATUS = {
  yes: { label: 'Yes', color: '#10b981', icon: '✓' },
  no: { label: 'No', color: '#ef4444', icon: '✗' },
  maybe: { label: 'Maybe', color: '#f59e0b', icon: '?' },
  none: { label: 'No Response', color: '#9ca3af', icon: '∅' }
};

function RosterManagement({ currentUser }) {
  const [season, setSeason] = useState('fall');
  const [currentUserId, setCurrentUserId] = useState(null);
  const [userProfile, setUserProfile] = useState(null);
  const [selectedTeam, setSelectedTeam] = useState('');
  const [selectedGame, setSelectedGame] = useState(null);
  const [rsvps, setRsvps] = useState({});
  const [lastRsvpUpdate, setLastRsvpUpdate] = useState({}); // Track last RSVP update per game
  const [battingOrder, setBattingOrder] = useState({});
  const [fieldingPositions, setFieldingPositions] = useState({});
  const [benchPlayers, setBenchPlayers] = useState({});
  const [draggedPlayer, setDraggedPlayer] = useState(null);
  const [dropTarget, setDropTarget] = useState(null);
  const [loading, setLoading] = useState(true);
  const [savingLineup, setSavingLineup] = useState(false);
  const [players, setPlayers] = useState([]);
  const [games, setGames] = useState([]);
  const [allTeams, setAllTeams] = useState([]);
  const [currentSeason, setCurrentSeason] = useState(null);
  
  // Mobile detection and tab state
  const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
  const [activeTab, setActiveTab] = useState('rsvp');
  const [currentInning, setCurrentInning] = useState(1); // For mobile fielding view
  
  // Finalization state
  const [battingFinalized, setBattingFinalized] = useState({});
  const [fieldingFinalized, setFieldingFinalized] = useState({});
  
  // Player selection modal state
  const [showPlayerModal, setShowPlayerModal] = useState(false);
  const [modalConfig, setModalConfig] = useState({
    title: '',
    availablePlayers: [],
    onSelect: null,
    playerNumber: ''
  });

  // Past game picker (Option 1)
  const [pastGames, setPastGames] = useState([]);
  const [pastGamesLoaded, setPastGamesLoaded] = useState(false);
  const [pastGameSelectBatting, setPastGameSelectBatting] = useState('');
  const [pastGameSelectFielding, setPastGameSelectFielding] = useState('');
  const [loadingFromPast, setLoadingFromPast] = useState(false);

  // Template save/load (Option 3)
  const [battingTemplates, setBattingTemplates] = useState([]);
  const [fieldingTemplates, setFieldingTemplates] = useState([]);
  const [templatesLoaded, setTemplatesLoaded] = useState(false);
  const [showTemplateModal, setShowTemplateModal] = useState(false);
  const [templateModalType, setTemplateModalType] = useState(''); // 'batting' | 'fielding'
  const [templateNameInput, setTemplateNameInput] = useState('');
  const [savingTemplate, setSavingTemplate] = useState(false);
  const [templateSelectBatting, setTemplateSelectBatting] = useState('');
  const [templateSelectFielding, setTemplateSelectFielding] = useState('');

  const isCaptain = (() => {
    if (!userProfile) return false;
    if (userProfile.isAdmin || userProfile.userRole === 'admin' || userProfile.userRole === 'league-staff') return true;
    if (userProfile.isCaptain) return true;
    if (selectedTeam && userProfile.teamRoles && typeof userProfile.teamRoles === 'object') {
      const entry = Object.entries(userProfile.teamRoles).find(
        ([key]) => key.toLowerCase() === selectedTeam.toLowerCase()
      );
      if (entry) {
        const teamRole = entry[1];
        if (teamRole.status === 'active' && (teamRole.role === 'captain' || teamRole.role === 'team-staff')) {
          return true;
        }
      }
    }
    return false;
  })();

  // True only for team-staff (not captain/admin) — used for UI labels only
  const isTeamStaffRole = (() => {
    if (!userProfile || !selectedTeam || !userProfile.teamRoles) return false;
    const entry = Object.entries(userProfile.teamRoles).find(
      ([key]) => key.toLowerCase() === selectedTeam.toLowerCase()
    );
    return !!(entry && entry[1].status === 'active' && entry[1].role === 'team-staff');
  })();
  const seasonConfig = SEASONS[season];

  // Helper function to format relative time
  const formatRelativeTime = (timestamp) => {
    if (!timestamp) return null;
    
    const now = new Date();
    const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
    const diffMs = now - date;
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);
    
    if (diffMins < 1) return 'just now';
    if (diffMins === 1) return '1 minute ago';
    if (diffMins < 60) return `${diffMins} minutes ago`;
    if (diffHours === 1) return '1 hour ago';
    if (diffHours < 24) return `${diffHours} hours ago`;
    if (diffDays === 1) return 'yesterday';
    if (diffDays < 7) return `${diffDays} days ago`;
    
    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  };

  useEffect(() => {
    loadInitialData();
  }, []);

  // Handle window resize for mobile detection
  useEffect(() => {
    const handleResize = () => {
      const newIsMobile = window.innerWidth < 768;
      setIsMobile(newIsMobile);
      console.log(`📱 Screen width: ${window.innerWidth}px - Mobile mode: ${newIsMobile}`);
    };
    
    // Log initial state
    console.log(`📱 Initial screen width: ${window.innerWidth}px - Mobile mode: ${isMobile}`);
    
    window.addEventListener('resize', handleResize);
    return () => window.removeEventListener('resize', handleResize);
  }, []);

  useEffect(() => {
    if (selectedTeam && currentSeason) {
      loadTeamData();
    }
  }, [selectedTeam, currentSeason]);

  useEffect(() => {
    if (games.length > 0 && selectedTeam && players.length > 0) {
      const cleanup = loadGameData();
      return () => {
        if (cleanup && typeof cleanup.then === 'function') {
          cleanup.then(unsubscribe => unsubscribe && unsubscribe());
        }
      };
    }
  }, [games, selectedTeam, players]);

  useEffect(() => {
    if (selectedGame && selectedTeam && players.length > 0 && isCaptain) {
      loadLineupForGame(selectedGame);
    }
  }, [selectedGame]);

  async function loadLineupForGame(gameId) {
    try {
      const [batting, fielding, bench] = await Promise.all([
        window.FirebaseRoster.getBattingOrder(gameId, selectedTeam),
        window.FirebaseRoster.getFieldingPositions(gameId, selectedTeam),
        window.FirebaseRoster.getBenchPlayers(gameId, selectedTeam)
      ]);

      const battingWithPlayers = batting.map(playerId =>
        players.find(p => p.id === playerId) || null
      );

      const hydratedBench = {};
      Object.entries(bench).forEach(([inning, playerIds]) => {
        hydratedBench[inning] = playerIds.map(id =>
          players.find(p => p.id === id || p.authId === id) || null
        ).filter(p => p !== null);
      });

      setBattingOrder(prev => ({ ...prev, [gameId]: battingWithPlayers }));
      setFieldingPositions(prev => ({ ...prev, [gameId]: fielding }));
      setBenchPlayers(prev => ({ ...prev, [gameId]: hydratedBench }));

      try {
        const battingDocRef = window.firebaseImports.doc(window.firebaseImports.db, 'lineups', gameId, 'batting', selectedTeam);
        const battingDoc = await window.firebaseImports.getDoc(battingDocRef);
        if (battingDoc.exists() && battingDoc.data().finalized) {
          setBattingFinalized(prev => ({ ...prev, [gameId]: true }));
        }
      } catch (error) {
        console.log('Error loading batting finalization status:', error);
      }
    } catch (error) {
      console.error('Error loading lineup for game:', gameId, error);
    }
  }

  async function loadInitialData() {
    try {
      if (!currentUser || !currentUser.uid) {
        console.error('❌ No currentUser available!');
        return;
      }
      
      const seasonData = await window.FirebaseRoster.getCurrentSeason();
      setCurrentSeason(seasonData);
      
      if (seasonData.season.toLowerCase() === 'summer') {
        setSeason('summer');
      } else {
        setSeason('fall');
      }
      
      const teams = await window.FirebaseRoster.getAllTeams();
      const teamNames = teams.map(t => t.name || t.id).sort();
      setAllTeams(teamNames);
      
      const profileResult = await window.FirebaseRoster.getUserProfile(currentUser.uid);
      
      if (profileResult.success && profileResult.data) {

            )}
          </>
        )}

        {!selectedTeam && (
          <div style={{ background: 'var(--card-bg)', padding: '2rem', borderRadius: '16px', textAlign: 'center', boxShadow: 'var(--shadow-sm)', border: '1px solid var(--border-color)' }}>
            <h3 style={{ marginTop: 0, color: 'var(--text-dark)' }}>Welcome to Roster Management</h3>
            <p style={{ color: 'var(--text-light)' }}>Select your team to get started with RSVPs and lineup management</p>
          </div>
        )}
      </div>
    </div>
    </>
  );
}

function updateConnectionStatus() {
  const status = document.getElementById('connectionStatus');
  if (!status) return;
  
  const icon = status.querySelector('.status-icon');
  const text = status.querySelector('.status-text');
  
  if (navigator.onLine) {
    // Show "Back online" message
    status.classList.remove('hidden');  // SHOW IT FIRST
    status.classList.add('online');
    icon.textContent = '✅';
    text.textContent = 'Back online';
    
    // Hide after 3 seconds
    setTimeout(() => {
      status.classList.add('hidden');
    }, 3000);
  } else {
    // Show "You're offline" message
    status.classList.remove('hidden', 'online');
    icon.textContent = '📡';
    text.textContent = "You're offline";
  }
}

window.addEventListener('online', updateConnectionStatus);
window.addEventListener('offline', updateConnectionStatus);
if (!navigator.onLine) updateConnectionStatus();
</script>
