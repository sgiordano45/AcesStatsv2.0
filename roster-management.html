<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="RSVP for your Mountainside Aces games and see your team's batting order and defense.">
<title>Roster and RSVPs - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/roster-management.css">
</head>
<body class="aces-v2">

<!-- roster-management.html: RSVPs, batting order and defense for a team's
     upcoming games (js/pages/roster-management.js, roster-lineup.js,
     roster-core.js; data in js/data/lineups.js). Rebuilt in v2.0 from the
     React version; same Firestore data. -->

<main class="rm aces-container" id="main">
  <header class="aces-page-head rm-top">
    <div>
      <span class="aces-page-kicker" id="rmKicker">This season</span>
      <h1 class="aces-page-title">Roster and RSVPs</h1>
      <p class="rm-who" id="rmWho"></p>
    </div>
    <div class="rm-side">
      <label class="rm-team-pick" id="rmTeamPick" hidden>Team
        <span class="aces-select-wrap is-inline"><select class="aces-select is-sm" id="rmTeam"></select></span>
      </label>
      <span class="rm-save" id="rmSave" role="status" aria-live="polite"></span>
    </div>
  </header>

  <div data-page-loading>
    <div class="rm-games">
      <span class="aces-skeleton is-card" style="width:156px;height:72px"></span>
      <span class="aces-skeleton is-card" style="width:156px;height:72px"></span>
      <span class="aces-skeleton is-card" style="width:156px;height:72px"></span>
    </div>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
  </div>

  <div data-page-content hidden>
    <div class="rm-games" id="rmGames" aria-label="Upcoming games"></div>
    <nav class="aces-tabs rm-tabs" id="rmTabs" role="tablist" aria-label="Sections"></nav>
    <div id="rmPanel"></div>
  </div>
</main>

<div class="rm-print" id="rmPrint" aria-hidden="true"></div>

<script type="module" src="js/pages/roster-management.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
