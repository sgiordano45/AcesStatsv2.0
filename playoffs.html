<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="The Mountainside Aces playoff bracket: seeds, series, scores and the champion.">
<title>Playoffs - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/playoffs.css">
</head>
<body class="aces-v2">

<!-- playoffs.html[?seasonId=]: the playoff bracket (js/pages/playoffs.js, playoffs-format.js,
     playoffs-share.js). Bracket doc: seasons/{id}/playoffs/bracket. -->

<main class="po aces-container" id="main">
  <header class="aces-page-head po-head">
    <div class="po-id">
      <span class="po-logo" id="poLogo"></span>
      <div>
        <span class="aces-page-kicker" id="poKicker">Playoffs</span>
        <h1 class="aces-page-title">Playoffs</h1>
      </div>
    </div>
    <div class="po-actions">
      <button type="button" class="aces-btn is-sm" data-act="share"><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-share"></use></svg>Share image</button>
      <a class="aces-btn is-sm is-ghost" href="champions.html"><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-flag"></use></svg>Past playoffs</a>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span></div>
    <div class="po-bracket" style="--po-cols:4">
      <div class="aces-card"><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
      <div class="aces-card"><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
      <div class="aces-card"><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
      <div class="aces-card"><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
    </div>
  </div>

  <div data-page-content hidden>
    <div id="poStatus" class="po-status"></div>
    <div id="poStaff"></div>
    <div id="poChampion"></div>
    <div id="poBracket"></div>
    <div id="poSeeds"></div>
  </div>
</main>

<script type="module" src="js/pages/playoffs.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
