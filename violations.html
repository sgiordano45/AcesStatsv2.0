<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="The Wall of Shame: Mountainside Aces rule-breakers, the shame board and the photo evidence.">
<title>Wall of Shame - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/violations.css">
</head>
<body class="aces-v2">

<!-- violations.html: Wall of Shame (js/pages/violations.js). Anyone can view; captains, league staff and Mall Cops report and add photos. -->

<main class="vs aces-container" id="main">
  <header class="aces-page-head">
    <div>
      <span class="aces-page-kicker">History</span>
      <h1 class="aces-page-title">Wall of Shame</h1>
      <p class="vs-desc">Where rule-breakers get the recognition they truly deserve.</p>
    </div>
    <div class="vs-actions" id="vsActions"></div>
  </header>

  <div data-page-loading>
    <div class="aces-card"><span class="aces-skeleton is-row"></span></div>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span></div>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span></div>
  </div>

  <div data-page-content hidden id="vsRoot">
    <div class="vs-seasons" role="group" aria-label="Season">
      <div class="aces-segmented" id="vsSeasons"></div>
    </div>
    <div class="aces-stats vs-stats" id="vsStats"></div>
    <nav class="aces-tabs vs-tabs" id="vsTabs" aria-label="Wall of Shame sections"></nav>
    <section id="vs-log"></section>
    <section id="vs-board" hidden></section>
    <section id="vs-gallery" hidden></section>
  </div>
</main>

<script type="module" src="js/pages/violations.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
