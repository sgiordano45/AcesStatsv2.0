<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Compare Mountainside Aces players and teams side by side, and every team's head-to-head record.">
<title>Compare - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/compare.css">
</head>
<body class="aces-v2">

<main class="cmp aces-container" id="main">
  <header class="aces-page-head">
    <div>
      <span class="aces-page-kicker">Stats</span>
      <h1 class="aces-page-title">Compare</h1>
    </div>
  </header>

  <div class="aces-segmented cmp-modes" role="group" aria-label="What to compare">
    <button type="button" class="aces-segment" data-mode="players" aria-pressed="true">Players</button>
    <button type="button" class="aces-segment" data-mode="teams" aria-pressed="false">Teams</button>
    <button type="button" class="aces-segment" data-mode="grid" aria-pressed="false">Head-to-head</button>
  </div>

  <div class="cmp-controls" id="cmpControls"></div>

  <div class="cmp-results" id="cmpResults" aria-live="polite">
    <div class="aces-card" aria-busy="true">
      <span class="aces-skeleton is-title"></span>
      <span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span>
    </div>
  </div>
</main>

<script type="module" src="js/pages/compare.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
