<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A Mountainside Aces team across every season: record, titles, season by season, stats, leaders and photos.">
<title>Team - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/team.css">
</head>
<body class="aces-v2">

<!-- team.html?team=Teal&tab=stats: one team across every season (js/pages/team.js).
     This season's roster and schedule are on current-season-team.html. -->

<main class="tp aces-container" id="main">
  <header class="aces-page-head tp-head">
    <div class="tp-id">
      <span class="tp-logo" id="tpLogo"></span>
      <div>
        <span class="aces-page-kicker" id="tpKicker">All seasons</span>
        <h1 class="aces-page-title" id="tpTitle">Team</h1>
      </div>
    </div>
    <div class="tp-actions" id="tpActions"></div>
  </header>

  <div data-page-loading>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
    <div class="aces-stats tp-summary">
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
    </div>
  </div>

  <div data-page-content hidden>
    <div id="tpHero"></div>
    <div class="aces-stats tp-summary" id="tpStats"></div>
    <nav class="aces-tabs tp-tabs" id="tpTabs" aria-label="Team sections"></nav>
    <div id="tpSeasons" hidden></div>
    <div id="tpStatsPanel" hidden></div>
    <div id="tpLeaders" hidden></div>
    <div id="tpPhotos" hidden></div>
  </div>
</main>

<dialog class="tp-viewer" id="tpViewer" aria-label="Photo viewer">
  <button type="button" class="tp-viewer-btn is-close" data-viewer="close" aria-label="Close">
    <svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-close"></use></svg></button>
  <button type="button" class="tp-viewer-btn is-prev" data-viewer="prev" aria-label="Previous">
    <svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-chevron-left"></use></svg></button>
  <div class="tp-viewer-stage" data-stage></div>
  <button type="button" class="tp-viewer-btn is-next" data-viewer="next" aria-label="Next">
    <svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-chevron-right"></use></svg></button>
  <p class="tp-viewer-info" data-info></p>
</dialog>

<script type="module" src="js/pages/team.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
