<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mountainside Aces - Pitching Statistics</title>
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="nav-styles.css">
<link rel="stylesheet" href="dark-mode.css">
<style>
:root {
  --primary-color: #2d5016;
  --secondary-color: #1a6b4a;
  --accent-color: #ffd700;
  --pitching-primary: #11998e;
  --pitching-secondary: #38ef7d;
  --card-bg: #ffffff;
  --text-dark: #2d3748;
  --text-light: #718096;
  --border-color: #e2e8f0;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.16);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
  min-height: 100vh;
  color: var(--text-dark);
  line-height: 1.6;
}

/* Page Header - Pitching themed with teal/green gradient */
.page-header {
  background: linear-gradient(135deg, var(--pitching-primary) 0%, var(--pitching-secondary) 100%);
  padding: 4rem 2rem;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
  color: white;
  text-align: center;
}

.page-header::before {
  content: '';
  position: absolute;
  top: -50px;
  right: -50px;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
  border-radius: 50%;
}

.page-header::after {
  content: '🥎';
  position: absolute;
  bottom: -30px;
  left: -30px;
  font-size: 200px;
  opacity: 0.05;
}

.page-header h1 {
  font-size: 3.5rem;
  font-weight: 800;
  margin-bottom: 1rem;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  position: relative;
  z-index: 1;
}

.page-header p {
  font-size: 1.3rem;
  font-weight: 300;
  opacity: 0.9;
  position: relative;
  z-index: 1;
}

/* Dashboard Container */
.page-container {
  max-width: 1400px;
  margin: 3rem auto;
  padding: 0 2rem;
}

/* Summary Section */
.summary {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 2rem;
  margin-bottom: 2rem;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
  position: relative;
}

.summary::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 5px;
  background: linear-gradient(90deg, var(--pitching-primary) 0%, var(--pitching-secondary) 100%);
  border-radius: 16px 16px 0 0;
}

.summary h2 {
  margin: 0 0 1.5rem 0;
  color: var(--text-dark);
  font-size: 1.5rem;
  font-weight: 700;
}

.summary p {
  margin: 0 0 1rem 0;
  color: var(--text-dark);
  font-size: 1rem;
  line-height: 1.6;
}

.summary p:last-child {
  margin-bottom: 0;
  color: var(--text-light);
  font-size: 0.95rem;
}

/* Loading Indicator */
#loadingIndicator {
  text-align: center;
  padding: 3rem;
  color: var(--text-light);
  background: white;
  border-radius: 16px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
  margin-bottom: 2rem;
  font-size: 1.1rem;
  position: relative;
}

#loadingIndicator::before {
  content: "⏳";
  display: block;
  font-size: 3rem;
  margin-bottom: 1rem;
  animation: spin 2s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Filters Section */
.filters-section {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 2rem;
  margin-bottom: 2rem;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
  position: relative;
}

.filters-section::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 5px;
  background: linear-gradient(90deg, var(--pitching-primary) 0%, var(--pitching-secondary) 100%);
  border-radius: 16px 16px 0 0;
}

.filters-container {
  display: flex;
  flex-wrap: wrap;
  gap: 1.5rem;
  align-items: center;
  justify-content: center;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.filter-group label {
  font-weight: 600;
  color: var(--text-dark);
}

.filter-group select {
  padding: 0.6rem 1.2rem;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: white;
  color: var(--text-dark);
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s ease;
}

.filter-group select:focus {
  outline: none;
  border-color: var(--pitching-primary);
  box-shadow: 0 0 0 3px rgba(17,153,142,0.1);
}

/* Navigation Section */
.filters-nav {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 2rem;
  margin-bottom: 2rem;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
  position: relative;
}

.filters-nav::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 5px;
  background: linear-gradient(90deg, var(--pitching-primary) 0%, var(--pitching-secondary) 100%);
  border-radius: 16px 16px 0 0;
}

.nav-section {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 2rem;
  margin-bottom: 2rem;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
}

.nav-container {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  align-items: center;
  justify-content: center;
}

.nav-link {
  padding: 0.8rem 1.5rem;
  border: 2px solid var(--primary-color);
  background: white;
  color: var(--primary-color);
  text-decoration: none;
  border-radius: 12px;
  font-weight: 600;
  font-size: 1rem;
  transition: all 0.3s ease;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  position: relative;
  overflow: hidden;
  cursor: pointer;
}

.nav-link::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--primary-color);
  transform: translateX(-100%);
  transition: transform 0.3s ease;
  z-index: -1;
}

.nav-link:hover::before {
  transform: translateX(0);
}

.nav-link:hover {
  color: white;
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.nav-link.batting {
  border-color: var(--primary-color);
  color: var(--primary-color);
}

.nav-link.batting::before {
  background: var(--primary-color);
}

.nav-link.pitching {
  border-color: var(--pitching-primary);
  color: var(--pitching-primary);
}

.nav-link.pitching::before {
  background: var(--pitching-primary);
}

.nav-link.pitching.active {
  background: var(--pitching-primary);
  color: white;
}

.mobile-nav-container {
  display: none;
}

/* Mobile Responsive */
@media (max-width: 768px) {
  .page-header h1 {
    font-size: 2.5rem;
  }
  
  .page-header p {
    font-size: 1.1rem;
  }
  
  .page-container {
    padding: 0 1rem;
    margin: 2rem auto;
  }
  
  .summary, .filters-section, .filters-nav {
    padding: 1.5rem;
  }
  
  .filters-container {
    flex-direction: column;
    gap: 1rem;
  }
  
  .filter-group {
    flex-direction: column;
    text-align: center;
    gap: 0.5rem;
    width: 100%;
  }
  
  .filter-group select {
    width: 100%;
  }
  
  .nav-container {
    flex-direction: column;
  }
  
  .nav-link {
    width: 100%;
    justify-content: center;
  }
  
  .mobile-nav-container {
    display: block;
  }
}

@media (max-width: 480px) {
  .page-header {
    padding: 3rem 1rem;
  }
  
  .page-header h1 {
    font-size: 2rem;
  }
  
  .nav-link {
    display: block;
    text-align: center;
  }
}

.pitching-table {
  margin-top: 1.5rem;
}
</style>
</head>
<body>


<div class="page-container">
  <div class="page-header">
    <h1>⚾ Mountainside Aces Pitching Statistics</h1>
    <p>Complete pitching statistics for all players across all seasons</p>
  </div>

  <div class="summary" id="summary">
    <h2>Pitching Overview</h2>
    <p id="totalsText">Loading statistics...</p>
    <p id="leadersText"></p>
  </div>

  <div class="filters-section">
    <div class="filters-container">
      <div class="filter-group">
        <label for="seasonFilter">Season:</label>
        <select id="seasonFilter">
          <option value="all">All seasons</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="teamFilter">Team:</label>
        <select id="teamFilter">
          <option value="all">All teams</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Statistics Table (js/ui/table.js) -->
  <div id="pitchingTable" class="pitching-table"></div>
</div>

<script type="module">
  // firebase-data.js first: its firebase-config.js creates the Firebase app,
  // and js/core/firebase.js (loaded through app.js) reuses it.
  import { getAllPlayerStatsOptimized, pitchingSeasonsObjectToArray } from './firebase-data.js';
  import { initPage, pageReady, showPageState, showPageError } from './js/core/app.js';
  import { capitalize, formatPlayerName, formatIP, fmtRate } from './js/ui/format.js';
  import { era, QUALIFIERS, isQualifiedPitcher, qualifierLabel } from './js/domain/stats.js';
  import { parseStatSeasonId, seasonLabel, seasonSortKey, inningsValue } from './js/domain/season-ids.js';
  import { getTeamGames } from './js/data/team-games.js';
  import { mountStatTable } from './js/ui/table.js';
  import { sumFields } from './js/ui/table-model.js';
  import { playerColumn, teamColumn, seasonColumn, combinedTeam, combinedSeason } from './js/ui/stat-columns.js';
  import { mountStatFilters, pickDefaultSeason } from './js/ui/stat-filters.js';

  const COUNT_FIELDS = ['games', 'ip', 'runsAllowed'];
  const $ = (id) => document.getElementById(id);

  let allRows = [];   // one row per pitcher-season; the page filters apply on top

  // ---- rows ------------------------------------------------------------------

  function buildRows(players) {
    const rows = [];
    for (const player of players) {
      if (!player.pitchingSeasons || typeof player.pitchingSeasons !== 'object') continue;
      for (const s of pitchingSeasonsObjectToArray(player)) {
        const sid = parseStatSeasonId(s.seasonId);
        if (!sid.id) continue;
        const team = capitalize(String(s.team || player.currentTeam || '').toLowerCase());
        rows.push({
          id: player.userId || player.id || '',
          ids: [player.userId, player.id, player.playerId].filter(Boolean),
          name: formatPlayerName(player.name || player.displayName || player.userId),
          team,
          teamKey: team.toLowerCase(),
          seasonId: sid.id,
          seasonLabel: seasonLabel(sid.id),
          seasonKey: seasonSortKey(sid.id),
          seasonCount: 1,
          sub: sid.isSub,
          games: Number(s.games) || 0,
          ip: inningsValue(s.inningsPitched),   // thirds notation (5.1) -> 5.333
          runsAllowed: Number(s.runsAllowed) || 0,
          teamGames: 0
        });
      }
    }
    rows.sort((a, b) => b.seasonKey - a.seasonKey || a.team.localeCompare(b.team) || a.name.localeCompare(b.name));
    return rows;
  }

  async function attachTeamGames(rows) {
    const games = await getTeamGames(rows.map(r => r.seasonId));
    for (const r of rows) r.teamGames = games.get(r.seasonId, r.team);
  }

  // ---- table config ----------------------------------------------------------

  const rate = (v) => fmtRate(v);
  // Innings show as baseball thirds (5.1 = 5 1/3); per game they show as a decimal.
  const ipText = (v, r, ctx) => (v === null || v === undefined ? '-' : ctx?.perGame ? v.toFixed(2) : formatIP(v));

  const config = {
    id: '',
    cardSub: 'team',
    columns: [
      playerColumn({ page: 'pitcher.html' }),
      teamColumn(),
      seasonColumn(),
      { key: 'G', label: 'G', title: 'Games pitched', type: 'count', value: r => r.games, perGame: false },
      { key: 'IP', label: 'IP', title: 'Innings pitched', type: 'count', value: r => r.ip, format: ipText },
      { key: 'R', label: 'R', title: 'Runs allowed', type: 'count', shade: false, value: r => r.runsAllowed },
      { key: 'ERA', label: 'ERA', type: 'rate', lowerIsBetter: true, value: r => era(r.runsAllowed, r.ip), format: rate },
      { key: 'RG', label: 'R/G', title: 'Runs allowed per game pitched', type: 'rate', lowerIsBetter: true, value: r => (r.games ? r.runsAllowed / r.games : null), format: rate }
    ],
    // One view: pitching is runs and innings. The league doesn't track W/L/SV,
    // and K/BB/H aren't recorded consistently, so none of them are shown.
    presets: [
      { key: 'standard', label: 'Standard', sort: '-IP', card: ['G', 'IP', 'ERA', 'RG'],
        columns: ['name', 'team', 'season', 'G', 'IP', 'R', 'ERA', 'RG'] }
    ],
    games: r => r.games,
    qualifier: (state) => state.combine
      ? { label: `min ${QUALIFIERS.CAREER_MIN_IP} IP combined`, test: r => r.ip >= QUALIFIERS.CAREER_MIN_IP }
      : { label: qualifierLabel('pitching').replace(/^Min/, 'min'), test: r => r.teamGames > 0 && isQualifiedPitcher({ inningsPitched: r.ip }, r.teamGames) },
    combine: {
      label: 'Combine seasons',
      key: r => r.id || r.name,
      merge: (group) => ({
        ...group[0],
        ...sumFields(group, COUNT_FIELDS),
        ...combinedTeam(group),
        ...combinedSeason(group),
        teamGames: sumFields(group, ['teamGames']).teamGames
      })
    }
  };

  // ---- summary ---------------------------------------------------------------

  function updateSummary(rows) {
    const totalsText = $('totalsText');
    const leadersText = $('leadersText');
    if (!rows.length) { totalsText.textContent = 'No pitching stats for this selection'; leadersText.textContent = ''; return; }
    const sum = (f) => rows.reduce((s, r) => s + r[f], 0);
    const pitchers = new Set(rows.map(r => r.id || r.name)).size;
    totalsText.textContent = `${pitchers} pitchers | ${sum('games')} games | ${formatIP(sum('ip'))} innings pitched | ${sum('runsAllowed')} runs allowed`;

    // Leaders in the selection; fewest runs and best ERA need 30 innings.
    const min = QUALIFIERS.CAREER_MIN_IP;
    const best = (list, f) => list.reduce((m, r) => (f(r) > f(m) ? r : m), list[0]);
    const qual = rows.filter(r => r.ip >= min);
    const label = (r) => (r.seasonCount === 1 ? `, ${r.seasonLabel}` : '');
    const parts = [
      ['Games', best(rows, r => r.games), r => r.games],
      ['Innings Pitched', best(rows, r => r.ip), r => formatIP(r.ip)],
      qual.length && ['Fewest Runs Allowed', best(qual, r => -r.runsAllowed), r => r.runsAllowed],
      qual.length && ['Best ERA', best(qual, r => -era(r.runsAllowed, r.ip)), r => fmtRate(era(r.runsAllowed, r.ip))]
    ].filter(Boolean);
    leadersText.textContent = 'Leaders — ' + parts.map(([l, r, val]) => `${l}: ${r.name} (${val(r)}${label(r)})`).join(' | ') +
      `. Fewest runs and best ERA need ${min} innings.`;
  }

  // ---- start -------------------------------------------------------------------

  async function main() {
    const ctx = await initPage({ title: 'Pitching Statistics' });
    const me = new Set([ctx?.profile?.linkedPlayer, ctx?.profile?.playerId, ctx?.user?.uid].filter(Boolean));

    const table = mountStatTable($('pitchingTable'), config, {
      emptyMessage: 'No pitching stats for this selection.',
      exportName: 'aces-pitching',
      exportTitle: 'Aces pitching',
      rowClass: r => (me.size && r.ids.some(id => me.has(id)) ? 'is-me' : '')
    });

    const players = await getAllPlayerStatsOptimized();
    allRows = buildRows(players || []);
    if (!allRows.length) {
      showPageState({ title: 'No pitching stats yet', message: 'Stats show up here once games have been entered.', container: '#summary' });
      return;
    }

    const filters = mountStatFilters({
      season: $('seasonFilter'), team: $('teamFilter'),
      rows: allRows,
      defaultSeason: pickDefaultSeason(allRows.map(r => r.seasonId), ctx?.config),
      onChange: (rows) => { table.setRows(rows); updateSummary(rows); }
    });
    filters.apply();
    pageReady();

    try {
      await attachTeamGames(allRows);
      table.refresh();
    } catch (err) {
      console.warn('[pitching] team games unavailable; Qualified shows no one', err);
    }
  }

  main().catch((err) => showPageError(err, { container: '#summary' }));
</script>

<script src="mobile-enhancements.js"></script>
<script src="stat-tooltips.js"></script>
<script src="theme-toggle.js"></script>
</body>
</html>
