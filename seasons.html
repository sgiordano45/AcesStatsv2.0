<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Every Mountainside Aces season: champions, first-place teams, games and players.">
<title>Seasons - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/seasons.css">
</head>
<body class="aces-v2">

<!-- seasons.html: every season, newest first (js/pages/seasons.js). One season is season.html?seasonId=. -->

<main class="ss aces-container" id="main">
  <header class="aces-page-head ss-head">
    <div>
      <span class="aces-page-kicker">History</span>
      <h1 class="aces-page-title">Seasons</h1>
      <p class="ss-desc">Every Aces season, newest first. Open one for its standings, schedule, stats and awards.</p>
    </div>
    <div class="ss-links">
      <a class="aces-btn is-sm is-ghost" href="champions.html"><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-trophy"></use></svg>Champions</a>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-stats ss-stats">
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
    </div>
    <div class="ss-grid">
      <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
      <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
    </div>
  </div>

  <div data-page-content hidden>
    <div class="aces-stats ss-stats" id="ssStats"></div>
    <div id="ssList"></div>
  </div>
</main>

<script type="module" src="js/pages/seasons.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
