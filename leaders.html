<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Mountainside Aces leaders: career, best single seasons, one season, and the career milestone clubs.">
<title>Leaders - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/leaders.css">
</head>
<body class="aces-v2">

<!-- leaders.html?view=batting|pitching|milestones&scope=career|best|season&season=2026-fall
     (js/pages/leaders.js). Replaced milestones.html and pitching_leaders.html. -->

<main class="ld aces-container" id="main">
  <header class="aces-page-head ld-head">
    <div>
      <span class="aces-page-kicker">Stats</span>
      <h1 class="aces-page-title" id="ldTitle">Leaders</h1>
      <p class="ld-desc" id="ldDesc"></p>
    </div>
    <div class="ld-links">
      <a class="aces-btn is-sm is-ghost" href="batting.html"><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-table"></use></svg>Full stats</a>
    </div>
  </header>

  <nav class="aces-tabs ld-tabs" id="ldTabs" aria-label="Leaders"></nav>

  <div class="ld-scope" id="ldScope">
    <div class="aces-segmented" role="group" aria-label="Leader type" id="ldScopeBtns"></div>
    <label class="ld-season" id="ldSeasonWrap" hidden><span class="aces-label">Season</span>
      <span class="aces-select-wrap"><select class="aces-select is-sm" id="ldSeason"></select></span></label>
  </div>

  <div data-page-loading>
    <div class="ld-grid">
      <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
      <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
      <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
    </div>
  </div>
  <div data-page-content hidden>
    <div id="ldBody"></div>
  </div>
</main>

<script type="module" src="js/pages/leaders.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
