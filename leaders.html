<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaders - Mountainside Aces</title>
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="nav-styles.css">
<style>
:root {
  --primary-color: #2d5016;
  --secondary-color: #1a6b4a;
  --accent-color: #ffd700;
  --card-bg: #ffffff;
  --text-dark: #2d3748;
  --text-light: #718096;
  --border-color: #e2e8f0;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.16);
}

* {
  box-sizing: border-box;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  margin: 0;
  padding: 0;
  background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
  min-height: 100vh;
  line-height: 1.6;
  color: var(--text-dark);
}

/* Loading Overlay */
.loading-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

.loading-overlay.hidden {
  opacity: 0;
  visibility: hidden;
}

.softball-spinner {
  position: relative;
}

.softball-spinner::before {
  content: '⚾';
  font-size: 80px;
  animation: spin 1.5s ease-in-out infinite;
  display: block;
}

@keyframes spin {
  0%, 100% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(180deg) scale(1.1); }
}

/* Page Container */
.page-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 2rem;
}

/* Page Header */
.page-header {
  background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
  color: white;
  text-align: center;
  padding: 4rem 2rem;
  border-radius: 16px;
  margin-bottom: 2rem;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}

.page-header::before {
  content: '';
  position: absolute;
  top: -100px;
  right: -100px;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
  border-radius: 50%;
}

.page-header::after {
  content: '👑';
  position: absolute;
  bottom: -40px;
  left: -40px;
  font-size: 200px;
  opacity: 0.05;
}

.page-header h1 {
  margin: 0;
  font-size: 3.5rem;
  font-weight: 800;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  position: relative;
  z-index: 1;
}

.page-header p {
  margin: 1rem 0 0 0;
  font-size: 1.2rem;
  opacity: 0.95;
  position: relative;
  z-index: 1;
}

/* Navigation */
.filters-nav {
  background: var(--card-bg);
  padding: 1.5rem;
  border-radius: 16px;
  margin-bottom: 2rem;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
}

.nav-container {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  align-items: center;
  justify-content: center;
}

.nav-link {
  padding: 1rem 1.75rem;
  border: 2px solid var(--primary-color);
  background: white;
  color: var(--primary-color);
  text-decoration: none;
  border-radius: 12px;
  font-weight: 600;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  position: relative;
  overflow: hidden;
  z-index: 1;
}

.nav-link::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: var(--primary-color);
  transform: translateX(-100%);
  transition: transform 0.3s ease;
  z-index: -1;
}

.nav-link:hover::before,
.nav-link.active::before {
  transform: translateX(0);
}

.nav-link:hover,
.nav-link.active {
  color: white;
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.nav-link.pitching {
  border-color: #11998e;
  color: #11998e;
}

.nav-link.pitching::before {
  background: #11998e;
}

.nav-link.pitching:hover {
  color: white;
}

.nav-link.batting {
  border-color: var(--primary-color);
  color: var(--primary-color);
}

/* View Selector */
.view-selector {
  background: white;
  padding: 2rem;
  border-radius: 16px;
  margin-bottom: 2rem;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
  text-align: center;
}

.view-selector h3 {
  margin: 0 0 1.5rem 0;
  color: var(--text-dark);
  font-size: 1.5rem;
  font-weight: 700;
}

.toggle-buttons {
  display: flex;
  gap: 1rem;
  justify-content: center;
  flex-wrap: wrap;
}

.toggle-btn {
  padding: 1rem 2rem;
  border: 2px solid var(--border-color);
  background: white;
  color: var(--text-dark);
  border-radius: 12px;
  cursor: pointer;
  font-size: 1.1rem;
  font-weight: 600;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.toggle-btn::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  transform: translateX(-100%);
  transition: transform 0.3s ease;
  z-index: -1;
}

.toggle-btn.batting {
  border-color: var(--primary-color);
  color: var(--primary-color);
}

.toggle-btn.batting::before {
  background: var(--primary-color);
}

.toggle-btn.batting.active {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  box-shadow: var(--shadow-md);
}

.toggle-btn.pitching {
  border-color: #11998e;
  color: #11998e;
}

.toggle-btn.pitching::before {
  background: #11998e;
}

.toggle-btn.pitching.active {
  background: #11998e;
  color: white;
  border-color: #11998e;
  box-shadow: var(--shadow-md);
}

.toggle-btn:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.toggle-btn:hover::before {
  transform: translateX(0);
}

.toggle-btn:hover {
  color: white;
}

/* Scope Selector (Career vs Season) */
.scope-selector {
  background: white;
  padding: 1.5rem 2rem;
  border-radius: 16px;
  margin-bottom: 1rem;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
  text-align: center;
}

.scope-selector h3 {
  margin: 0 0 1rem 0;
  color: var(--text-dark);
  font-size: 1.25rem;
  font-weight: 700;
}

.scope-toggle {
  display: inline-flex;
  background: #f1f5f9;
  border-radius: 12px;
  padding: 4px;
  gap: 4px;
}

.scope-btn {
  padding: 0.75rem 1.5rem;
  border: none;
  background: transparent;
  color: var(--text-light);
  border-radius: 10px;
  cursor: pointer;
  font-size: 1rem;
  font-weight: 600;
  transition: all 0.3s ease;
}

.scope-btn:hover {
  color: var(--text-dark);
}

.scope-btn.active {
  background: white;
  color: var(--primary-color);
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.scope-description {
  margin-top: 0.75rem;
  font-size: 0.9rem;
  color: var(--text-light);
}

/* Leaders Container */
.leaders-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
  gap: 2rem;
}

/* Leader Section */
.leader-section {
  background: var(--card-bg);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
  position: relative;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.leader-section::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 5px;
  background: linear-gradient(90deg, var(--primary-color) 0%, var(--secondary-color) 100%);
  opacity: 0;
  transition: opacity 0.4s ease;
}

.leader-section.pitching::before {
  background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
}

.leader-section::after {
  content: '⚾';
  position: absolute;
  bottom: -20px;
  right: -20px;
  font-size: 120px;
  opacity: 0;
  color: var(--primary-color);
  transition: all 0.4s ease;
  pointer-events: none;
}

.leader-section.pitching::after {
  color: #11998e;
}

.leader-section:hover {
  transform: translateY(-8px);
  box-shadow: var(--shadow-lg);
  border-color: var(--primary-color);
}

.leader-section.pitching:hover {
  border-color: #11998e;
}

.leader-section:hover::before {
  opacity: 1;
}

.leader-section:hover::after {
  opacity: 0.05;
  bottom: -10px;
  right: -10px;
}

.leader-section h3 {
  background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
  color: white;
  margin: 0;
  padding: 1.75rem;
  font-size: 1.4rem;
  font-weight: 700;
  text-align: center;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
}

.leader-section.pitching h3 {
  background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
}

/* Leader Table */
.leader-table {
  width: 100%;
  margin: 0;
  background: white;
}

.leader-table th,
.leader-table td {
  padding: 1rem;
  text-align: left;
  border-bottom: 1px solid var(--border-color);
}

.leader-table th {
  background: #f8f9fa;
  font-weight: 700;
  color: var(--text-dark);
  text-align: center;
  text-transform: uppercase;
  font-size: 0.85rem;
  letter-spacing: 0.5px;
}

.leader-table tr:nth-child(even) {
  background: #fafafa;
}

.leader-table tr:hover {
  background: linear-gradient(90deg, rgba(45, 80, 22, 0.05) 0%, rgba(26, 107, 74, 0.05) 100%);
  transition: background 0.2s ease;
}

.leader-section.pitching .leader-table tr:hover {
  background: linear-gradient(90deg, rgba(17, 153, 142, 0.05) 0%, rgba(56, 239, 125, 0.05) 100%);
}

.leader-table a {
  color: var(--primary-color);
  text-decoration: none;
  font-weight: 600;
  transition: all 0.3s ease;
  position: relative;
}

.leader-table a::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  width: 0;
  height: 2px;
  background: var(--primary-color);
  transition: width 0.3s ease;
}

.leader-section.pitching .leader-table a {
  color: #11998e;
}

.leader-section.pitching .leader-table a::after {
  background: #11998e;
}

.leader-table a:hover {
  color: var(--secondary-color);
}

.leader-section.pitching .leader-table a:hover {
  color: #0f8a80;
}

.leader-table a:hover::after {
  width: 100%;
}

.rank {
  text-align: center;
  font-weight: 700;
  color: var(--text-light);
  width: 80px;
  background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
  font-size: 1rem;
}

.stat-value {
  text-align: center;
  font-weight: 700;
  min-width: 100px;
  color: var(--text-dark);
  font-size: 1.05rem;
}

.season-cell {
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--text-light);
  min-width: 90px;
}

.minimum-note {
  font-style: italic;
  color: var(--text-light);
  text-align: center;
  padding: 1rem 1.5rem;
  font-size: 0.9rem;
  background: #f8f9fa;
  border-bottom: 1px solid var(--border-color);
  font-weight: 600;
}

/* Achievement badges for top performers */
.rank-1 .rank {
  background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
  color: #333;
  font-weight: 800;
  box-shadow: 0 2px 6px rgba(255, 215, 0, 0.3);
}

.rank-1 .rank::after {
  content: " 🥇";
}

.rank-1:hover {
  background: linear-gradient(90deg, rgba(255, 215, 0, 0.1) 0%, rgba(255, 237, 78, 0.1) 100%);
}

.rank-2 .rank {
  background: linear-gradient(135deg, #c0c0c0 0%, #e8e8e8 100%);
  color: #333;
  font-weight: 800;
  box-shadow: 0 2px 6px rgba(192, 192, 192, 0.3);
}

.rank-2 .rank::after {
  content: " 🥈";
}

.rank-2:hover {
  background: linear-gradient(90deg, rgba(192, 192, 192, 0.1) 0%, rgba(232, 232, 232, 0.1) 100%);
}

.rank-3 .rank {
  background: linear-gradient(135deg, #cd7f32 0%, #daa560 100%);
  color: white;
  font-weight: 800;
  box-shadow: 0 2px 6px rgba(205, 127, 50, 0.3);
}

.rank-3 .rank::after {
  content: " 🥉";
}

.rank-3:hover {
  background: linear-gradient(90deg, rgba(205, 127, 50, 0.1) 0%, rgba(218, 165, 96, 0.1) 100%);
}

/* Loading state */
.loading {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-light);
  background: var(--card-bg);
  border-radius: 16px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
  font-size: 1.1rem;
}

.loading::before {
  content: "⚾";
  display: block;
  font-size: 4rem;
  margin-bottom: 1.5rem;
  animation: bounce 1s ease-in-out infinite;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-20px) scale(1.1); }
}

/* Fade in animation */
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.leader-section {
  animation: fadeInUp 0.6s ease backwards;
}

.leader-section:nth-child(1) { animation-delay: 0.05s; }
.leader-section:nth-child(2) { animation-delay: 0.1s; }
.leader-section:nth-child(3) { animation-delay: 0.15s; }
.leader-section:nth-child(4) { animation-delay: 0.2s; }
.leader-section:nth-child(5) { animation-delay: 0.25s; }
.leader-section:nth-child(6) { animation-delay: 0.3s; }
.leader-section:nth-child(7) { animation-delay: 0.35s; }
.leader-section:nth-child(8) { animation-delay: 0.4s; }

/* Mobile responsive adjustments */
@media (max-width: 768px) {
  .page-container {
    padding: 1rem;
  }
  
  .page-header {
    padding: 2rem 1rem;
  }
  
  .page-header h1 {
    font-size: 2.5rem;
  }
  
  .nav-container {
    justify-content: center;
    flex-direction: column;
    gap: 0.5rem;
  }
  
  .nav-link {
    padding: 0.8rem 1.25rem;
    font-size: 0.95rem;
    text-align: center;
    width: 100%;
    justify-content: center;
  }
  
  .toggle-buttons {
    flex-direction: column;
    align-items: stretch;
  }
  
  .toggle-btn {
    width: 100%;
  }
  
  .leaders-container {
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }
  
  .leader-section h3 {
    padding: 1.25rem;
    font-size: 1.2rem;
  }
  
  .leader-table th,
  .leader-table td {
    padding: 0.75rem 0.5rem;
    font-size: 0.9rem;
  }
  
  .rank {
    width: 60px;
    font-size: 0.9rem;
  }
  
  .stat-value {
    min-width: 80px;
    font-size: 0.95rem;
  }
}

@media (max-width: 480px) {
  .page-header h1 {
    font-size: 2rem;
  }
  
  .leader-table th,
  .leader-table td {
    padding: 0.6rem 0.3rem;
    font-size: 0.85rem;
  }
  
  .leader-section h3 {
    font-size: 1.1rem;
    padding: 1rem;
  }
  
  .rank {
    width: 50px;
    font-size: 0.85rem;
  }
  
  .stat-value {
    min-width: 70px;
    font-size: 0.9rem;
  }
  
  .minimum-note {
    padding: 0.75rem 1rem;
    font-size: 0.8rem;
  }
}

/* Season picker under the scope buttons (One Season). */
.season-pick { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 1rem; }
.season-pick[hidden] { display: none; }
.season-pick label { font-weight: 600; }
.season-pick select { padding: 0.5rem 0.75rem; border-radius: 8px; border: 1px solid var(--border-color, #e2e8f0); font: inherit; background: var(--card-bg, #fff); color: inherit; }
.scope-toggle { flex-wrap: wrap; }

/* The signed-in player: gold row in the top 10, or a gold row under it. */
.leader-table tr.is-me td { background: var(--color-accent-soft, #fff5c2) !important; }
.leader-table tr.is-me td:first-child { box-shadow: inset 3px 0 0 var(--color-accent, #ffd700); }
.leader-table tr.me-extra td { border-top: 2px dashed var(--color-border-strong, #cdd1c9); }
</style>
</head>
<body>
<div id="loadingOverlay" class="loading-overlay">
  <div class="softball-spinner"></div>
</div>

<div class="page-container">
  <div class="page-header">
    <h1 id="pageTitle">⚾ Batting Career Leaders</h1>
    <p>Top 10 leaders in major statistical categories</p>
  </div>

  <div class="filters-nav">

  </div>

  <div class="scope-selector">
    <h3>Leader Type</h3>
    <div class="scope-toggle">
      <button id="careerScopeBtn" class="scope-btn active" onclick="switchToScope('career')">
        🏆 Career
      </button>
      <button id="bestScopeBtn" class="scope-btn" onclick="switchToScope('best')">
        ⭐ Best Seasons
      </button>
      <button id="seasonScopeBtn" class="scope-btn" onclick="switchToScope('season')">
        📅 One Season
      </button>
    </div>
    <div id="seasonPickWrap" class="season-pick" hidden>
      <label for="seasonPick">Season:</label>
      <select id="seasonPick"></select>
    </div>
    <p id="scopeDescription" class="scope-description">All-time career totals and averages</p>
  </div>

  <div class="view-selector">
    <h3>Select Leader Category</h3>
    <div class="toggle-buttons">
      <button id="battingLeadersBtn" class="toggle-btn batting active" onclick="switchToView('batting')">
        ⚾ Batting Leaders
      </button>
      <button id="pitchingLeadersBtn" class="toggle-btn pitching" onclick="switchToView('pitching')">
        🥎 Pitching Leaders
      </button>
    </div>
  </div>



  <div id="leaders-container" class="leaders-container">
    <div class="loading">Loading career leaders from optimized collection...</div>
  </div>
</div>

<script type="module">
// Leaders: top 10 per stat for Career, Best single seasons (all time) or one
// season, batting or pitching. Rows come from js/ui/batting-stats.js and
// js/ui/pitching-stats.js; rate stats use the shared minimums.
//
// URL: leaders.html?view=pitching&scope=career|best|season&season=2026-fall

// firebase-data.js first: its firebase-config.js creates the Firebase app,
// and js/core/firebase.js (loaded through app.js) reuses it.
import { getAllPlayerStatsOptimized } from './firebase-data.js';
import { initPage, pageReady, showPageError } from './js/core/app.js';
import { escapeHtml as esc, fmtAvg, fmtRate, formatIP } from './js/ui/format.js';
import { battingLine, era, QUALIFIERS, isQualifiedBatter, isQualifiedPitcher, qualifierLabel } from './js/domain/stats.js';
import { seasonLabel, sortSeasonIds, seasonHasHitTypes } from './js/domain/season-ids.js';
import { applyTeamGames } from './js/data/team-games.js';
import { combineRows } from './js/ui/table-model.js';
import { pickDefaultSeason } from './js/ui/stat-filters.js';
import { teamChipHtml } from './js/ui/stat-columns.js';
import { buildBattingRows, battingTableConfig } from './js/ui/batting-stats.js';
import { buildPitchingRows, pitchingTableConfig } from './js/ui/pitching-stats.js';

const $ = (id) => document.getElementById(id);
const TOP = 10;

let bat = [];          // player-season batting rows
let pit = [];          // pitcher-season pitching rows
let me = new Set();    // the signed-in player's IDs (View As aware)
let state = { view: 'batting', scope: 'career', season: '' };
let defaultSeason = '';

// ---- rows per scope ------------------------------------------------------------

const batMerge = battingTableConfig().combine.merge;
const pitMerge = pitchingTableConfig().combine.merge;

// One row per player per season: old seasons stored sub games as a separate
// record ('2024-fall-gold-sub'), so a player who also subbed is merged.
function seasonRows(rows, merge) {
  return combineRows(rows, {
    key: r => `${r.id || r.name}|${r.seasonId}`,
    merge: (group) => {
      if (group.length === 1) return group[0];
      const regular = group.filter(r => !r.sub);
      const main = regular[0] || group[0];
      return {
        ...merge(group),
        seasonCount: 1, seasonId: main.seasonId, seasonLabel: main.seasonLabel, seasonKey: main.seasonKey,
        acesBPI: main.acesBPI ?? null,
        teamGames: Math.max(...(regular.length ? regular : group).map(r => r.teamGames || 0))
      };
    }
  });
}

function careerRows(rows, merge) {
  return combineRows(rows, {
    key: r => r.id || r.name,
    merge: (group) => {
      const bpis = group.map(r => r.acesBPI).filter(v => typeof v === 'number');
      return { ...merge(group), avgBPI: bpis.length ? bpis.reduce((a, b) => a + b, 0) / bpis.length : null };
    }
  });
}

function rowsFor(kind) {
  const base = kind === 'batting' ? bat : pit;
  const merge = kind === 'batting' ? batMerge : pitMerge;
  if (state.scope === 'career') return careerRows(base, merge);
  const seasons = seasonRows(base, merge);
  return state.scope === 'season' ? seasons.filter(r => r.seasonId === state.season) : seasons;
}

// ---- categories -------------------------------------------------------------------

const avg = (v) => fmtAvg(v);
const pa = (r) => r.atBats + r.walks;

function battingCategories() {
  const career = state.scope === 'career';
  const qualified = career
    ? { test: r => pa(r) >= QUALIFIERS.CAREER_MIN_PA, note: `Minimum ${QUALIFIERS.CAREER_MIN_PA} plate appearances` }
    : { test: r => r.teamGames > 0 && isQualifiedBatter(r, r.teamGames), note: qualifierLabel('batting') };
  const cats = [
    { title: 'Games Played', icon: '\u{1F3AE}', value: r => r.games },
    { title: 'At-Bats', icon: '⚾', value: r => r.atBats },
    { title: 'Hits', icon: '\u{1F3AF}', value: r => r.hits },
    { title: 'Runs Scored', icon: '\u{1F3C3}', value: r => r.runs },
    { title: 'Walks', icon: '\u{1F6B6}', value: r => r.walks },
    { title: 'Batting Average', icon: '\u{1F4CA}', value: r => (r.atBats ? battingLine(r).avg : null), format: avg, ...qualified },
    { title: 'On-Base Percentage', icon: '\u{1F3AF}', value: r => (pa(r) ? battingLine(r).obp : null), format: avg, ...qualified },
    career
      ? { title: 'AcesBPI (Average)', icon: '⭐', value: r => r.avgBPI, format: v => fmtRate(v), ...qualified }
      : { title: 'AcesBPI', icon: '⭐', value: r => r.acesBPI, format: v => fmtRate(v), ...qualified }
  ];
  // Extra-base hits and RBI: one season, players on teams that tracked them
  // for every game (all teams from 2026 Fall; some in 2026 Summer).
  if (state.scope === 'season' && seasonHasHitTypes(state.season)) {
    const tracked = (fn) => (r) => (r.hasHitTypes ? fn(r) : null);
    const allTeams = bat.filter(r => r.seasonId === state.season).every(r => r.hasHitTypes);
    const note = allTeams ? '' : 'Teams that tracked them for every game';
    const withNote = (c) => ({ ...c, note: [c.note, note].filter(Boolean).join(' · ') || undefined });
    cats.push(
      withNote({ title: 'Doubles', icon: '✌️', value: tracked(r => r.doubles) }),
      withNote({ title: 'Home Runs', icon: '\u{1F4A5}', value: tracked(r => r.homeRuns) }),
      withNote({ title: 'RBI', icon: '\u{1F91D}', value: tracked(r => r.rbi) }),
      withNote({ title: 'Slugging', icon: '\u{1F4AA}', value: tracked(r => (r.atBats ? battingLine(r).slg : null)), format: avg, ...qualified }),
      withNote({ title: 'OPS', icon: '\u{1F525}', value: tracked(r => (r.atBats ? battingLine(r).ops : null)), format: avg, ...qualified })
    );
  }
  return cats;
}

function pitchingCategories() {
  const qualified = state.scope === 'career'
    ? { test: r => r.ip >= QUALIFIERS.CAREER_MIN_IP, note: `Minimum ${QUALIFIERS.CAREER_MIN_IP} innings pitched` }
    : { test: r => r.teamGames > 0 && isQualifiedPitcher({ inningsPitched: r.ip }, r.teamGames), note: qualifierLabel('pitching') };
  const ipCol = { title: 'IP', value: r => r.ip, format: v => formatIP(v) };
  return [
    { title: 'Games Pitched', icon: '\u{1F3AE}', value: r => r.games },
    { title: 'Innings Pitched', icon: '⏱️', value: r => r.ip, format: v => formatIP(v) },
    { title: state.scope === 'career' ? 'Career ERA' : 'ERA', icon: '\u{1F4C9}', value: r => era(r.runsAllowed, r.ip), format: v => fmtRate(v), ascending: true, extra: ipCol, ...qualified },
    { title: 'Fewest Runs Allowed', icon: '\u{1F6E1}️', value: r => r.runsAllowed, ascending: true, extra: ipCol, ...qualified }
  ];
}

// ---- rendering ---------------------------------------------------------------------

const isMe = (r) => me.size > 0 && (r.ids || []).some(id => me.has(id));

function leaderTable(rows, cat, kind) {
  const fmt = cat.format || (v => String(v));
  const list = rows
    .filter(r => (cat.test ? cat.test(r) : true))
    .map(r => ({ r, v: cat.value(r) }))
    .filter(x => typeof x.v === 'number' && Number.isFinite(x.v))
    .sort((a, b) => (cat.ascending ? a.v - b.v : b.v - a.v) || a.r.name.localeCompare(b.r.name));
  if (!list.length) return '';

  // Ties share a rank.
  let rank = 0;
  list.forEach((x, i) => { if (i === 0 || x.v !== list[i - 1].v) rank = i + 1; x.rank = rank; });

  const page = kind === 'pitching' ? 'pitcher.html' : 'player.html';
  const showSeason = state.scope === 'best';
  const showTeam = state.scope === 'season';
  const row = (x, extraClass = '') => {
    const r = x.r;
    const cls = [x.rank <= 3 ? `rank-${x.rank}` : '', isMe(r) ? 'is-me' : '', extraClass].filter(Boolean).join(' ');
    const q = r.id ? `id=${encodeURIComponent(r.id)}` : `name=${encodeURIComponent(r.name)}`;
    return `<tr${cls ? ` class="${cls}"` : ''}>
      <td class="rank">${x.rank}</td>
      <td><a href="${page}?${esc(q)}">${esc(r.name)}</a></td>
      <td class="stat-value">${esc(fmt(x.v))}</td>
      ${cat.extra ? `<td class="stat-value">${esc(cat.extra.format(cat.extra.value(r)))}</td>` : ''}
      ${showSeason ? `<td class="stat-value season-cell">${esc(r.seasonLabel)}</td>` : ''}
      ${showTeam ? `<td class="stat-value">${teamChipHtml(r)}</td>` : ''}
    </tr>`;
  };

  const top = list.slice(0, TOP);
  // "You are here": the signed-in player's best row when it's outside the top 10.
  const mine = list.findIndex(x => isMe(x.r));
  const youRow = mine >= TOP ? row(list[mine], 'me-extra') : '';

  return `
    <div class="leader-section ${kind === 'pitching' ? 'pitching' : ''}">
      <h3>${cat.icon} ${esc(cat.title)}</h3>
      ${cat.note ? `<div class="minimum-note">${esc(cat.note)}</div>` : ''}
      <table class="leader-table">
        <thead><tr>
          <th class="rank">Rank</th><th>Player</th><th class="stat-value">${esc(cat.title)}</th>
          ${cat.extra ? `<th class="stat-value">${esc(cat.extra.title)}</th>` : ''}
          ${showSeason ? '<th class="stat-value">Season</th>' : ''}
          ${showTeam ? '<th class="stat-value">Team</th>' : ''}
        </tr></thead>
        <tbody>${top.map(x => row(x)).join('')}${youRow}</tbody>
      </table>
    </div>`;
}

function render() {
  const kind = state.view;
  const rows = rowsFor(kind);
  const cats = kind === 'batting' ? battingCategories() : pitchingCategories();
  const html = cats.map(c => leaderTable(rows, c, kind)).join('');
  $('leaders-container').innerHTML = html ||
    `<div class="loading">No ${kind} stats for ${state.scope === 'season' ? esc(seasonLabel(state.season)) : 'this view'} yet.</div>`;
}

// ---- controls -----------------------------------------------------------------------

const SCOPE_TEXT = {
  career: 'All-time career totals and averages',
  best: 'Best single-season performances ever',
  season: 'Leaders for one season'
};

function syncControls() {
  const typeText = state.view === 'batting' ? 'Batting' : 'Pitching';
  const scopeText = state.scope === 'career' ? 'Career' : state.scope === 'best' ? 'Best Season' : seasonLabel(state.season);
  $('pageTitle').textContent = `${state.view === 'batting' ? '⚾' : '\u{1F94E}'} ${typeText} ${scopeText} Leaders`;
  $('battingLeadersBtn').classList.toggle('active', state.view === 'batting');
  $('pitchingLeadersBtn').classList.toggle('active', state.view === 'pitching');
  for (const s of ['career', 'best', 'season']) $(`${s}ScopeBtn`).classList.toggle('active', state.scope === s);
  $('seasonPickWrap').hidden = state.scope !== 'season';
  $('seasonPick').value = state.season;
  $('scopeDescription').textContent = SCOPE_TEXT[state.scope];
}

function writeUrl() {
  const p = new URLSearchParams(location.search);
  const set = (k, v, dflt) => (v && v !== dflt ? p.set(k, v) : p.delete(k));
  set('view', state.view, 'batting');
  set('scope', state.scope, 'career');
  set('season', state.scope === 'season' ? state.season : '', defaultSeason);
  const qs = p.toString();
  history.replaceState(history.state, '', `${location.pathname}${qs ? `?${qs}` : ''}${location.hash}`);
}

function update(patch) {
  Object.assign(state, patch);
  syncControls();
  render();
  writeUrl();
}

// The old inline onclick handlers.
window.switchToView = (view) => update({ view: view === 'pitching' ? 'pitching' : 'batting' });
window.switchToScope = (scope) => update({ scope: ['career', 'best', 'season'].includes(scope) ? scope : 'career' });

// ---- start ----------------------------------------------------------------------------

async function main() {
  const ctx = await initPage({ title: 'Leaders' });
  me = new Set([ctx?.profile?.linkedPlayer, ctx?.profile?.playerId, ctx?.profile?.id, ctx?.profile?.mergedFromProfile, String(ctx?.profile?.linkedPlayer || '').trim().toLowerCase().replace(/\s+/g, '_'), ctx?.user?.uid].filter(Boolean));

  const players = await getAllPlayerStatsOptimized();
  bat = buildBattingRows(players);
  pit = buildPitchingRows(players);

  const seasonIds = sortSeasonIds(bat.map(r => r.seasonId).concat(pit.map(r => r.seasonId)));
  defaultSeason = pickDefaultSeason(seasonIds, ctx?.config);
  $('seasonPick').innerHTML = seasonIds.map(id => `<option value="${esc(id)}">${esc(seasonLabel(id))}</option>`).join('');
  $('seasonPick').addEventListener('change', (e) => update({ season: e.target.value }));

  const p = new URLSearchParams(location.search);
  state = {
    view: p.get('view') === 'pitching' ? 'pitching' : 'batting',
    scope: ['career', 'best', 'season'].includes(p.get('scope')) ? p.get('scope') : 'career',
    season: seasonIds.includes(p.get('season')) ? p.get('season') : defaultSeason
  };

  // Team games are needed for the single-season minimums.
  await Promise.all([applyTeamGames(bat, { fallbackToPlayerGames: true }), applyTeamGames(pit)]).catch(err =>
    console.warn('[leaders] team games unavailable; single-season rate leaders will be empty', err));

  syncControls();
  render();
  $('loadingOverlay')?.classList.add('hidden');
  pageReady();
}

main().catch((err) => {
  $('loadingOverlay')?.classList.add('hidden');
  showPageError(err, { container: '#leaders-container' });
});
</script>
