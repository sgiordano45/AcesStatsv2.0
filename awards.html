<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>League Awards - Mountainside Aces</title>
<!-- Retired in v2.0: League Awards is now the Awards tab of league-history.html. Kept so old links still work. -->
<meta http-equiv="refresh" content="0; url=league-history.html?tab=awards">
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var out = new URLSearchParams({ tab: 'awards' });
    var y = q.get('year'), s = q.get('season') || q.get('seasonId');
    if (s && /^\d{4}-/.test(s)) out.set('season', s);
    else if (y && s) out.set('season', y + '-' + s.toLowerCase());
    if (q.get('award')) out.set('award', q.get('award'));
    location.replace('league-history.html?' + out.toString() + location.hash);
  })();
</script>
</head>
<body>
<p>League Awards has moved. <a href="league-history.html?tab=awards">Go to the new page</a>.</p>
</body>
</html>
