    function renderTeams() {
      const grid = document.getElementById('teamsGrid');
      grid.innerHTML = '';
      
      Object.keys(teams).forEach(teamName => {
        const teamData = teams[teamName];
        const emptySlots = Math.max(0, teamData.maxRoster - teamData.players.length);
        
        const teamCard = document.createElement('div');
        teamCard.className = 'team-card';
        teamCard.dataset.team = teamName;
        
        teamCard.innerHTML = `
          <div class="team-header">
            <h2>${teamName}</h2>
            <p>${teamData.players.length}/${teamData.maxRoster}</p>
          </div>
          <div class="team-players">
            ${teamData.players.map(player => `
              <div class="player-card ${player.isNew ? 'new-player' : ''} ${player.oot ? 'oot-player' : ''} ${player.u30 ? 'u30-player' : ''}" draggable="true" data-player-id="${player.id}">
                <div class="player-name">${player.name}${player.isNew ? '<span class="new-badge">NEW</span>' : ''}${player.oot ? '<span class="oot-badge">OOT</span>' : ''}${player.u30 ? '<span class="u30-badge">U30</span>' : ''}</div>
                <div class="player-stats">
                  <span>BA: ${player.ba}</span>
                  <span>AcesBPI: ${player.acesBPI}</span>
                </div>
              </div>
            `).join('')}
            ${Array.from({ length: emptySlots }, (_, i) => `<div class="empty-slot">Empty</div>`).join('')}
          </div>
        `;
        
        grid.appendChild(teamCard);
      });
      
      setupDragAndDrop();
    }
    
    function renderUnavailable() {
      const grid = document.getElementById('unavailablePlayersGrid');
      if (!grid) return;
      
      grid.innerHTML = unavailablePlayers.map(player => `
        <div class="unavailable-player player-card ${player.isNew ? 'new-player' : ''} ${player.oot ? 'oot-player' : ''} ${player.u30 ? 'u30-player' : ''}" draggable="true" data-player-id="${player.id}">
          <div class="player-name">${player.name}${player.isNew ? '<span class="new-badge">NEW</span>' : ''}${player.oot ? '<span class="oot-badge">OOT</span>' : ''}${player.u30 ? '<span class="u30-badge">U30</span>' : ''}</div>
          <div class="player-stats">
            <span>BA: ${player.ba}</span>
            <span>BPI: ${player.acesBPI}</span>
          </div>
        </div>
      `).join('');
      
      setupUnavailableDrag();
    }
    
    function renderUnassigned() {
      const zone = document.getElementById('unassignedZone');
      const grid = document.getElementById('unassignedPlayersGrid');
      const empty = document.getElementById('unassignedEmpty');
      
      if (!zone || !grid) return;
      
      // Show/hide zone based on whether there are unassigned players
      if (unassignedPlayers.length > 0) {
        zone.style.display = 'block';
        grid.style.display = 'grid';
        empty.style.display = 'none';
      } else {
        zone.style.display = 'none';
        return;
      }
      
      grid.innerHTML = unassignedPlayers.map(player => `
        <div class="unassigned-player player-card" draggable="true" data-player-id="${player.id}">
          <div class="player-name">
            ${player.name}
            <span class="import-badge">IMPORTED</span>
            ${player.oot ? '<span class="oot-badge">OOT</span>' : ''}
            ${player.u30 ? '<span class="u30-badge">U30</span>' : ''}
          </div>
          <div class="player-stats">
            <span>New Player</span>
            ${player.importedAt ? `<span>Added: ${new Date(player.importedAt).toLocaleDateString()}</span>` : ''}
          </div>
        </div>
      `).join('');
      
      setupUnassignedDrag();
    }
    
    function setupUnassignedDrag() {
      var unassignedZone = document.getElementById('unassignedZone');
      if (unassignedZone) {
        unassignedZone.addEventListener('dragover', function(e) {
          e.preventDefault();
          unassignedZone.classList.add('drag-over');
        });
        unassignedZone.addEventListener('dragleave', function(e) {
          if (!unassignedZone.contains(e.relatedTarget)) {
            unassignedZone.classList.remove('drag-over');
          }
        });
        unassignedZone.addEventListener('drop', function(e) {
          e.preventDefault();
          unassignedZone.classList.remove('drag-over');
          handleDrop('unassigned');
          renderTeams();
          renderUnassigned();
        });
      }
      document.querySelectorAll('#unassignedPlayersGrid .player-card').forEach(card => {
        card.addEventListener('dragstart', (e) => {
          const playerId = e.target.dataset.playerId;
          const player = unassignedPlayers.find(p => p.id === playerId);
          
          draggedPlayer = { player, fromTeam: 'unassigned' };
          e.target.classList.add('dragging');
        });
        
        card.addEventListener('dragend', (e) => {
          e.target.classList.remove('dragging');
        });
      });
    }
    
    function renderChangelog() {
      const list = document.getElementById('changelogList');
      console.log('🎨 renderChangelog called');
      console.log('📋 changeLog array:', changeLog);
      console.log('📋 changeLog.length:', changeLog.length);
      console.log('📍 changelogList element:', list);
      
      if (!list) {
        console.log('⚠️ changelogList element not found!');
        return;
      }
      
      if (changeLog.length === 0) {
        console.log('ℹ️ No changelog entries, showing empty state');
        list.innerHTML = '<div class="changelog-empty">No changes yet</div>';
        return;
      }
      
      console.log('✅ Rendering', changeLog.length, 'changelog entries');
      list.innerHTML = changeLog.map(entry => {
        const timestamp = entry.timestamp?.toDate ? entry.timestamp.toDate() : new Date();
        const timeStr = formatRelativeTime(timestamp);
        
        return `
          <div class="changelog-item">
            <div><span class="user">${entry.userName}</span> ${entry.details}</div>
            <div class="time">${timeStr}</div>
          </div>
        `;
      }).join('');
    }
    
    function formatRelativeTime(date) {
      const seconds = Math.floor((new Date() - date) / 1000);
      
      if (seconds < 60) return 'Just now';
      if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
      return `${Math.floor(seconds / 86400)}d ago`;
    }
    
    function populatePastPlayersDropdown() {
      const select = document.getElementById('pastPlayerSelect');
      if (!select) return;
      
      // Clear existing options except the first one
      select.innerHTML = '<option value="">Select a player...</option>';
      
      // Add past players sorted by most recent season
      pastPlayers.forEach(player => {
        const option = document.createElement('option');
        option.value = player.id;
        option.textContent = `${player.name} - ${player.lastTeam} (${player.lastSeason})`;
        option.dataset.playerData = JSON.stringify(player);
        select.appendChild(option);
      });
      
      console.log(`✅ Populated dropdown with ${pastPlayers.length} past players`);
    }
    
    function populateTeamSelectDropdown() {
      const select = document.getElementById('teamSelect');
      const newPlayerSelect = document.getElementById('newPlayerTeamSelect');
      
      // Populate both dropdowns
      [select, newPlayerSelect].forEach(dropdown => {
        if (!dropdown) return;
        
        // Clear and rebuild
        dropdown.innerHTML = '<option value="">Select a team...</option>';
        
        // Add existing teams
        Object.keys(teams).sort().forEach(teamName => {
          const option = document.createElement('option');
          option.value = teamName;
          option.textContent = `${teamName} (${teams[teamName].players.length}/${teams[teamName].maxRoster})`;
          dropdown.appendChild(option);
        });
        
        // Add "Create New Team" option
        const newTeamOption = document.createElement('option');
        newTeamOption.value = '__NEW_TEAM__';
        newTeamOption.textContent = '➕ Create New Team';
        dropdown.appendChild(newTeamOption);
      });
    }
    
    function setupDragAndDrop() {
      // Player drag events
      document.querySelectorAll('.player-card').forEach(card => {
        card.addEventListener('dragstart', (e) => {
          const playerId = e.target.dataset.playerId;
          const teamCard = e.target.closest('[data-team]');
          const fromTeam = teamCard ? teamCard.dataset.team : 'unavailable';
          
          const player = fromTeam === 'unavailable' 
            ? unavailablePlayers.find(p => p.id === playerId)
            : teams[fromTeam].players.find(p => p.id === playerId);
          
          draggedPlayer = { player, fromTeam };
          e.target.classList.add('dragging');
        });
        
        card.addEventListener('dragend', (e) => {
          e.target.classList.remove('dragging');
        });
      });
      
      // Team drop zones
      document.querySelectorAll('.team-card').forEach(card => {
        card.addEventListener('dragover', (e) => {
          e.preventDefault();
        });
        
        card.addEventListener('drop', (e) => {
          e.preventDefault();
          const toTeam = e.currentTarget.dataset.team;
          handleDrop(toTeam);
          renderTeams();
          renderUnassigned();
        });
      });
    }
    
    function setupUnavailableDrag() {
      const zone = document.getElementById('unavailableZone');
      if (!zone) return;
      
      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
      });
      
      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        handleDrop('unavailable');
      });
      
      document.querySelectorAll('.unavailable-player').forEach(card => {
        card.addEventListener('dragstart', (e) => {
          const playerId = e.target.dataset.playerId;
          const player = unavailablePlayers.find(p => p.id === playerId);
          draggedPlayer = { player, fromTeam: 'unavailable' };
          e.target.classList.add('dragging');
        });
        
        card.addEventListener('dragend', (e) => {
          e.target.classList.remove('dragging');
        });
      });
    }
    
    function setupEventListeners() {
      // Tab switching
      document.querySelectorAll('.add-player-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          // Remove active from all tabs
          document.querySelectorAll('.add-player-tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          
          // Activate clicked tab
          tab.classList.add('active');
          const tabId = tab.dataset.tab === 'past-player' ? 'pastPlayerTab' : 'newPlayerTab';
          document.getElementById(tabId).classList.add('active');
        });
      });
      
      // Past player selection
      const pastPlayerSelect = document.getElementById('pastPlayerSelect');
      const teamSelect = document.getElementById('teamSelect');
      const addBtn = document.getElementById('addPastPlayerBtn');
      const preview = document.getElementById('playerPreview');
      
      if (pastPlayerSelect) {
        pastPlayerSelect.addEventListener('change', () => {
          const playerId = pastPlayerSelect.value;
          addBtn.disabled = !playerId || !teamSelect.value;
          
          if (playerId) {
            const selectedOption = pastPlayerSelect.options[pastPlayerSelect.selectedIndex];
            const player = JSON.parse(selectedOption.dataset.playerData);
            
            document.getElementById('previewName').textContent = player.name;
            document.getElementById('previewBA').textContent = player.ba;
            document.getElementById('previewBPI').textContent = player.acesBPI;
            document.getElementById('previewSeason').textContent = player.lastSeason;
            document.getElementById('previewTeam').textContent = player.lastTeam;
            preview.style.display = 'block';
          } else {
            preview.style.display = 'none';
          }
        });
      }
      
      if (teamSelect) {
        teamSelect.addEventListener('change', () => {
          addBtn.disabled = !pastPlayerSelect.value || !teamSelect.value;
        });
      }
      
      if (addBtn) {
        addBtn.addEventListener('click', async () => {
          const playerId = pastPlayerSelect.value;
          let teamName = teamSelect.value;
          
          if (!playerId || !teamName) {
            alert('Please select both a player and a team');
            return;
          }
          
          // Handle new team creation
          if (teamName === '__NEW_TEAM__') {
            const newTeamName = prompt('Enter new team name (e.g., "Army", "Special Team"):');
            if (!newTeamName || !newTeamName.trim()) return;
            
            teamName = newTeamName.trim();
            
            // Create new team if it doesn't exist
            if (!teams[teamName]) {
              teams[teamName] = {
                maxRoster: leagueMaxRoster || (seasonType === 'fall-to-summer' ? 16 : 14),
                players: []
              };
              console.log(`✅ Created new team: ${teamName}`);
            }
          }
          
          // Find the player data
          const selectedOption = pastPlayerSelect.options[pastPlayerSelect.selectedIndex];
          const pastPlayer = JSON.parse(selectedOption.dataset.playerData);
          
          if (!pastPlayer) {
            alert('Player data not found');
            return;
          }
          
          const team = teams[teamName];
          if (!team) {
            alert(`Team ${teamName} not found`);
            return;
          }
          
          if (team.players.length >= team.maxRoster) {
            alert(`${teamName} roster is full (${team.maxRoster}/${team.maxRoster})`);
            return;
          }
          
          // Add player to team
          team.players.push({
            id: pastPlayer.id,
            name: pastPlayer.name,
            ba: pastPlayer.ba,
            acesBPI: pastPlayer.acesBPI
          });
          
          // Remove from past players list
          pastPlayers = pastPlayers.filter(p => p.id !== pastPlayer.id);
          
          // Save and update UI
          await saveRosterChanges();
          await logChange('player_added', `added ${pastPlayer.name} to ${teamName}`);
          
          // Reset form
          pastPlayerSelect.value = '';
          teamSelect.value = '';
          preview.style.display = 'none';
          addBtn.disabled = true;
          
          showToast(`Added ${pastPlayer.name} to ${teamName}! ✅`, 'success');
          renderApp();
        });
      }
      
      // New player creation
      const newPlayerNameInput = document.getElementById('newPlayerName');
      const newPlayerTeamSelect = document.getElementById('newPlayerTeamSelect');
      const createBtn = document.getElementById('createNewPlayerBtn');
      
      if (newPlayerNameInput) {
        newPlayerNameInput.addEventListener('input', () => {
          const name = newPlayerNameInput.value.trim();
          createBtn.disabled = !name || !newPlayerTeamSelect.value;
        });
      }
      
      if (newPlayerTeamSelect) {
        newPlayerTeamSelect.addEventListener('change', () => {
          const name = newPlayerNameInput.value.trim();
          createBtn.disabled = !name || !newPlayerTeamSelect.value;
        });
      }
      
      if (createBtn) {
        createBtn.addEventListener('click', async () => {
          const playerName = newPlayerNameInput.value.trim();
          let teamName = newPlayerTeamSelect.value;
          
          if (!playerName || !teamName) {
            alert('Please enter a player name and select a team');
            return;
          }
          
          // Handle new team creation
          if (teamName === '__NEW_TEAM__') {
            const newTeamName = prompt('Enter new team name (e.g., "Army", "Special Team"):');
            if (!newTeamName || !newTeamName.trim()) return;
            
            teamName = newTeamName.trim();
            
            // Create new team if it doesn't exist
            if (!teams[teamName]) {
              teams[teamName] = {
                maxRoster: leagueMaxRoster || (seasonType === 'fall-to-summer' ? 16 : 14),
                players: []
              };
              console.log(`✅ Created new team: ${teamName}`);
            }
          }
          
          const team = teams[teamName];
          if (!team) {
            alert(`Team ${teamName} not found`);
            return;
          }
          
          if (team.players.length >= team.maxRoster) {
            alert(`${teamName} roster is full (${team.maxRoster}/${team.maxRoster})`);
            return;
          }
          
          // Check for duplicate names
          const playerId = playerName.toLowerCase().replace(/\s+/g, '_') + '_new_' + Date.now();
          const isDuplicate = Object.values(teams).some(t => 
            t.players.some(p => p.name.toLowerCase() === playerName.toLowerCase())
          );
          
          if (isDuplicate) {
            if (!confirm(`A player named "${playerName}" already exists. Add anyway?`)) {
              return;
            }
          }
          
          // Add new player to team
          team.players.push({
            id: playerId,
            name: playerName,
            ba: '.000',
            acesBPI: '0.0',
            isNew: true
          });
          
          // Save and update UI
          await saveRosterChanges();
          await logChange('new_player_created', `created new player ${playerName} on ${teamName}`);
          
          // Reset form
          newPlayerNameInput.value = '';
          newPlayerTeamSelect.value = '';
          createBtn.disabled = true;
          
          showToast(`Created ${playerName} on ${teamName}! ✅`, 'success');
          renderApp();
        });
      }
      
      // Toggle season type
      document.getElementById('toggleSeasonBtn').addEventListener('click', () => {
        seasonType = seasonType === 'fall-to-summer' ? 'summer-to-fall' : 'fall-to-summer';
        
        // Only update team maxRoster from seasonType if no custom value is set
        if (!leagueMaxRoster) {
          const derived = seasonType === 'fall-to-summer' ? 16 : 14;
          Object.keys(teams).forEach(team => { teams[team].maxRoster = derived; });
          document.getElementById('maxRosterInput').value = derived;
        }
        
        saveRosterChanges();
        logChange('season_type_changed', `changed season type to ${seasonType}`);
      });

      // Max roster input handler
      document.getElementById('maxRosterInput').addEventListener('change', () => {
        const val = parseInt(document.getElementById('maxRosterInput').value);
        if (isNaN(val) || val < 10 || val > 25) {
          showToast('Max roster must be between 10 and 25', 'error');
          document.getElementById('maxRosterInput').value = leagueMaxRoster || (seasonType === 'fall-to-summer' ? 16 : 14);
          return;
        }
        leagueMaxRoster = val;
        Object.keys(teams).forEach(team => { teams[team].maxRoster = val; });
        saveRosterChanges();
        logChange('max_roster_changed', `set max roster size to ${val}`);
        showToast(`Max roster set to ${val} for all teams`, 'success');
        renderTeams();
      });
      
      // Save changes
      document.getElementById('saveBtn').addEventListener('click', () => {
        saveRosterChanges();
      });
      
      // Reset from current season
      document.getElementById('resetBtn').addEventListener('click', async () => {
        if (confirm('⚠️ This will reset all changes and reload rosters from the current season. Are you sure?')) {
          console.log('🔄 User requested reset from current season');
          try {
            // Delete the current offseason document
            // Note: This orphans the changelog subcollection, but the new document 
            // will have a fresh changelog subcollection, so old entries won't appear
            const offseasonRef = doc(db, 'offseasonRosters', OFFSEASON_DOC_ID);
            await deleteDoc(offseasonRef);
            console.log('✅ Deleted existing offseason document');
            
            // Small delay to ensure Firestore processes the delete
            await new Promise(resolve => setTimeout(resolve, 300));
            
            // Recreate from current season (this will also reload past players)
            console.log('📝 Recreating from current season...');
            await createInitialOffseasonDoc();
            
            console.log('✅ Reset complete!');
            showToast('Rosters reset from current season! 🔄', 'success');
          } catch (error) {
            console.error('❌ Error resetting:', error);
            showToast('Error resetting rosters: ' + error.message, 'error');
          }
        }
      });
      
      // Toggle changelog
      document.getElementById('toggleChangelogBtn').addEventListener('click', () => {
        changelogVisible = !changelogVisible;
        const sidebar = document.getElementById('changelogSidebar');
        sidebar.classList.toggle('mobile-hidden');
      });
    }
    
    // ========================================
    // CREATE TEAM MODAL
    // ========================================
    
    window.showCreateTeamModal = function() {
      const modal = document.getElementById('createTeamModal');
      const input = document.getElementById('newTeamName');
      const info = document.getElementById('rosterSizeInfo');
      
      // Update roster size info based on current season type
      const maxRoster = leagueMaxRoster || (seasonType === 'fall-to-summer' ? 16 : 14);
      const seasonLabel = seasonType === 'fall-to-summer' ? 'Fall → Summer' : 'Summer → Fall';
      info.innerHTML = `Max roster will be set to <strong>${maxRoster} players</strong> (${seasonLabel})`;
      
      input.value = '';
      modal.classList.add('active');
      input.focus();
    };
    
    window.hideCreateTeamModal = function() {
      document.getElementById('createTeamModal').classList.remove('active');
    };
    
    window.createNewTeam = function() {
      const input = document.getElementById('newTeamName');
      const teamName = input.value.trim();
      
      if (!teamName) {
        showToast('Please enter a team name', 'error');
        return;
      }
      
      // Check for duplicate (case-insensitive)
      const existingNames = Object.keys(teams).map(n => n.toLowerCase());
      if (existingNames.includes(teamName.toLowerCase())) {
        showToast(`Team "${teamName}" already exists`, 'error');
        return;
      }
      
      // Create the team
      const maxRoster = leagueMaxRoster || (seasonType === 'fall-to-summer' ? 16 : 14);
      teams[teamName] = {
        maxRoster: maxRoster,
        players: []
      };
      
      // Save and re-render
      saveRosterChanges();
      logChange('team_created', `created team "${teamName}" with ${maxRoster} roster spots`);
      
      hideCreateTeamModal();
      renderTeams();
      populateTeamSelectDropdown();
      
      showToast(`Team "${teamName}" created! ✅`, 'success');
    };
    
    // Close modal on escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        hideCreateTeamModal();
      }
    });
    
    // Close modal on backdrop click
    document.getElementById('createTeamModal')?.addEventListener('click', (e) => {
      if (e.target.id === 'createTeamModal') {
        hideCreateTeamModal();
      }
    });
    
    // Enter key to submit
    document.getElementById('newTeamName')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        createNewTeam();
      }
    });
    
    // ========================================
    // LOAD FROM SEASON
    // ========================================
    
    async function loadAvailableSeasons() {
      try {
        const seasonsSnapshot = await getDocs(collection(db, 'seasons'));
        availableSeasons = seasonsSnapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        })).sort((a, b) => {
          // Sort by year desc, then fall before summer
          if (a.year !== b.year) return b.year - a.year;
          return a.season === 'fall' ? -1 : 1;
        });
        
        console.log(`📅 Loaded ${availableSeasons.length} seasons for dropdown`);
      } catch (error) {
        console.error('Error loading seasons:', error);
        availableSeasons = [];
      }
    }
    
    function populateSeasonDropdown() {
      const select = document.getElementById('loadSeasonSelect');
      if (!select) return;
      
      select.innerHTML = '<option value="">📅 Load from Season...</option>';
      
      availableSeasons.forEach(season => {
        const option = document.createElement('option');
        option.value = season.id;
        option.textContent = `${season.year} ${season.season.charAt(0).toUpperCase() + season.season.slice(1)}`;
        select.appendChild(option);
      });
    }
    
    window.handleLoadSeasonChange = async function(seasonId) {
      const select = document.getElementById('loadSeasonSelect');
      
      if (!seasonId) return;
      
      // Find selected season
      const selectedSeason = availableSeasons.find(s => s.id === seasonId);
      if (!selectedSeason) {
        select.value = '';
        return;
      }
      
      const seasonLabel = `${selectedSeason.year} ${selectedSeason.season.charAt(0).toUpperCase() + selectedSeason.season.slice(1)}`;
      
      // Confirm the action
      const confirmed = confirm(
        `⚠️ Load rosters from ${seasonLabel}?\n\n` +
        `This will:\n` +
        `• Replace all current team rosters\n` +
        `• Keep your unassigned players pool\n` +
        `• Keep unavailable players list\n\n` +
        `This is intended to kick off roster planning. Continue?`
      );
      
      if (!confirmed) {
        select.value = '';
        return;
      }
      
      // Show loading state
      select.disabled = true;
      const originalText = select.options[select.selectedIndex].text;
      select.options[select.selectedIndex].text = '⏳ Loading...';
      
      try {
        // Fetch players from that season
        const seasonPlayers = await getSeasonPlayerStatsOptimized(seasonId);
        console.log(`📊 Loaded ${seasonPlayers.length} players from ${seasonLabel}`);
        
        if (seasonPlayers.length === 0) {
          showToast(`No players found in ${seasonLabel}`, 'error');
          select.value = '';
          select.disabled = false;
          return;
        }
        
        // Get career stats for BA and AcesBPI
        const allPlayerStats = await getAllPlayerStatsOptimized();
        const playerStatsMap = {};
        allPlayerStats.forEach(player => {
          playerStatsMap[player.name] = {
            ba: player.career?.battingAverage?.toFixed(3) || '.000',
            acesBPI: player.career?.acesBPI?.toFixed(1) || '0.0'
          };
        });
        
        // Group players by team
        const newTeams = {};
        const maxRoster = leagueMaxRoster || (seasonType === 'fall-to-summer' ? 16 : 14);
        
        seasonPlayers.forEach(player => {
          const playerName = player.playerName || player.name || player.id;
          const teamName = player.team || player.teamId || player.currentTeam;
          
          if (!teamName || teamName === 'Unknown' || teamName.trim() === '') {
            console.log(`⚠️ Player ${playerName} has no team, skipping`);
            return;
          }
          
          if (!newTeams[teamName]) {
            newTeams[teamName] = {
              maxRoster: maxRoster,
              players: []
            };
          }
          
          const stats = playerStatsMap[playerName] || { ba: '.000', acesBPI: '0.0' };
          
          newTeams[teamName].players.push({
            id: playerName.toLowerCase().replace(/\s+/g, '_'),
            name: playerName,
            ba: stats.ba,
            acesBPI: stats.acesBPI
          });
        });
        
        console.log(`✅ Built ${Object.keys(newTeams).length} teams from ${seasonLabel}`);
        
        // Cross-reference against unassigned pool (player-import confirmed list)
        const confirmedNames = new Set(
          unassignedPlayers.map(p => (p.name || '').toLowerCase().trim())
        );
        const hasImportData = confirmedNames.size > 0;
        console.log('Import cross-ref: ' + confirmedNames.size + ' confirmed names in unassigned');

        if (hasImportData) {
          const notReturning = [];
          Object.keys(newTeams).forEach(teamName => {
            const keep = [];
            newTeams[teamName].players.forEach(player => {
              if (confirmedNames.has((player.name || '').toLowerCase().trim())) {
                keep.push(player);
              } else {
                notReturning.push(player);
              }
            });
            newTeams[teamName].players = keep;
          });

          // Move non-returners to unavailable (no dupes by name)
          const existingUnavailNames = new Set(
            unavailablePlayers.map(p => (p.name || '').toLowerCase().trim())
          );
          notReturning.forEach(p => {
            if (!existingUnavailNames.has((p.name || '').toLowerCase().trim())) {
              unavailablePlayers.push(p);
            }
          });
          console.log(notReturning.length + ' non-returners moved to Unavailable');

          // Remove placed returners from unassigned -- only new players remain
          const placedNames = new Set();
          Object.values(newTeams).forEach(team =>
            team.players.forEach(p => placedNames.add((p.name || '').toLowerCase().trim()))
          );
          const beforeCount = unassignedPlayers.length;
          unassignedPlayers = unassignedPlayers.filter(p =>
            !placedNames.has((p.name || '').toLowerCase().trim())
          );
          console.log('Unassigned: ' + beforeCount + ' -> ' + unassignedPlayers.length);
        }

        // Replace teams
        teams = newTeams;

        // Save changes
        await saveRosterChanges();
        await logChange('season_loaded', 'loaded rosters from ' + seasonLabel + ' (' + seasonPlayers.length + ' players)' + (hasImportData ? ', cross-referenced imports' : ''));

        // Re-render
        renderTeams();
        renderUnassigned();
        populateTeamSelectDropdown();

        const filterNote = hasImportData ? ' - ' + unassignedPlayers.length + ' new player(s) in Unassigned' : '';
        showToast('Loaded ' + seasonPlayers.length + ' players from ' + seasonLabel + '!' + filterNote, 'success');
        
      } catch (error) {
        console.error('Error loading season:', error);
        showToast('Error loading season: ' + error.message, 'error');
      } finally {
        select.value = '';
        select.disabled = false;
        // Restore option text
        const opt = Array.from(select.options).find(o => o.value === seasonId);
        if (opt) opt.text = originalText;
      }
    };
    
    window.refreshAllStats = async function() {
      var btn = event.currentTarget;
      btn.disabled = true; btn.textContent = "⏳ Refreshing...";
      try {
        var all = await getAllPlayerStatsOptimized();
        var map = {};
        all.forEach(function(p) {
          map[p.name] = {
            ba:      (p.career && p.career.battingAverage != null) ? p.career.battingAverage.toFixed(3) : null,
            acesBPI: (p.career && p.career.acesBPI != null) ? p.career.acesBPI.toFixed(1) : null
          };
        });
        var n = 0;
        var apply = function(arr) {
          (arr||[]).forEach(function(p) {
            var s = map[p.name]; if (!s) return;
            if (s.ba !== null)      { p.ba = s.ba; n++; }
            if (s.acesBPI !== null) { p.acesBPI = s.acesBPI; }
          });
        };
        Object.values(teams).forEach(function(t){ apply(t.players); });
        apply(unavailablePlayers); apply(unassignedPlayers);
        await saveRosterChanges();
        renderTeams(); renderUnassigned();
        showToast(n + " players refreshed with latest career stats ✅", "success");
      } catch(e) { showToast("Error: " + e.message, "error"); }
      finally { btn.disabled = false; btn.textContent = "🔄 Refresh Stats"; }
    };

    function showToast(message, type = 'info') {
      // Simple toast notification (you can enhance this)
      const toast = document.createElement('div');
      toast.style.cssText = `
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        background: ${type === 'success' ? '#10b981' : '#ef4444'};
        color: white;
        padding: 1rem 1.5rem;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        z-index: 10000;
        animation: slideIn 0.3s ease;
      `;
      toast.textContent = message;
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.animation = 'slideOut 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
    
    // ========================================
    // CONTEXT MENU (right-click / long-press)
    // ========================================
    let ctxPlayer = null;
    let ctxFromTeam = null;
    let longPressTimer = null;
    const contextMenu = document.getElementById('playerContextMenu');
    const ctxToggleOOT = document.getElementById('ctxToggleOOT');
    const ctxToggleU30 = document.getElementById('ctxToggleU30');
    const ctxRemove = document.getElementById('ctxRemove');

    function findPlayer(playerId) {
      for (const teamName of Object.keys(teams)) {
        const p = teams[teamName].players.find(p => p.id === playerId);
        if (p) return { player: p, fromTeam: teamName };
      }
      const unavail = unavailablePlayers.find(p => p.id === playerId);
      if (unavail) return { player: unavail, fromTeam: 'unavailable' };
      const unassigned = unassignedPlayers.find(p => p.id === playerId);
      if (unassigned) return { player: unassigned, fromTeam: 'unassigned' };
      return null;
    }

    function showContextMenu(e, playerId) {
      e.preventDefault();
      const found = findPlayer(playerId);
      if (!found) return;
      ctxPlayer = found.player;
      ctxFromTeam = found.fromTeam;
      ctxToggleOOT.textContent = ctxPlayer.oot ? 'Remove OOT' : 'Mark as OOT';
      ctxToggleU30.textContent = ctxPlayer.u30 ? 'Remove U30' : 'Mark as U30';
      contextMenu.style.display = 'block';
      const x = Math.min(e.clientX, window.innerWidth - 180);
      const y = Math.min(e.clientY, window.innerHeight - 100);
      contextMenu.style.left = x + 'px';
      contextMenu.style.top = y + 'px';
    }

    function hideContextMenu() {
      contextMenu.style.display = 'none';
      ctxPlayer = null;
      ctxFromTeam = null;
    }

    ctxToggleOOT.addEventListener('click', () => {
      if (!ctxPlayer) return;
      ctxPlayer.oot = !ctxPlayer.oot;
      saveRosterChanges();
      renderTeams();
      renderUnavailable();
      renderUnassigned();
      hideContextMenu();
    });

    ctxToggleU30.addEventListener('click', () => {
      if (!ctxPlayer) return;
      ctxPlayer.u30 = !ctxPlayer.u30;
      saveRosterChanges();
      renderTeams();
      renderUnavailable();
      renderUnassigned();
      hideContextMenu();
    });

    ctxRemove.addEventListener('click', () => {
      if (!ctxPlayer || !ctxFromTeam) return;
      if (ctxFromTeam === 'unavailable') {
        unavailablePlayers = unavailablePlayers.filter(p => p.id !== ctxPlayer.id);
      } else if (ctxFromTeam === 'unassigned') {
        unassignedPlayers = unassignedPlayers.filter(p => p.id !== ctxPlayer.id);
      } else {
        teams[ctxFromTeam].players = teams[ctxFromTeam].players.filter(p => p.id !== ctxPlayer.id);
      }
      saveRosterChanges();
      renderTeams();
      renderUnavailable();
      renderUnassigned();
      hideContextMenu();
    });

    document.addEventListener('click', (e) => {
      if (!contextMenu.contains(e.target)) hideContextMenu();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') hideContextMenu();
    });

    function addContextMenuListeners(card) {
      const playerId = card.dataset.playerId;
      if (!playerId) return;

      card.addEventListener('contextmenu', (e) => showContextMenu(e, playerId));

      // Long-press for mobile
      card.addEventListener('touchstart', (e) => {
        longPressTimer = setTimeout(() => {
          const touch = e.touches[0];
          showContextMenu({ preventDefault: () => {}, clientX: touch.clientX, clientY: touch.clientY }, playerId);
        }, 500);
      }, { passive: true });
      card.addEventListener('touchend', () => clearTimeout(longPressTimer));
      card.addEventListener('touchmove', () => clearTimeout(longPressTimer));
    }

    // Patch render functions to wire context menu after each render
    const _origSetupDnD = setupDragAndDrop;
    setupDragAndDrop = function() {
      _origSetupDnD();
      document.querySelectorAll('.team-card .player-card').forEach(addContextMenuListeners);
    };
    const _origSetupUnavail = setupUnavailableDrag;
    setupUnavailableDrag = function() {
      _origSetupUnavail();
      document.querySelectorAll('.unavailable-player.player-card').forEach(addContextMenuListeners);
    };
    const _origSetupUnassigned = setupUnassignedDrag;
    setupUnassignedDrag = function() {
      _origSetupUnassigned();
      document.querySelectorAll('#unassignedPlayersGrid .player-card').forEach(addContextMenuListeners);
    };

    // Clean up on page unload
    window.addEventListener('beforeunload', () => {
      if (unsubscribeRoster) unsubscribeRoster();
      if (unsubscribeChangelog) unsubscribeChangelog();
      if (unsubscribePresence) unsubscribePresence();
    });
  </script>
  <script src="mobile-enhancements.js"></script>
</body>
