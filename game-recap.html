<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Mountainside Aces game recap: final score, line score, standouts and the full box score.">
<title>Game Recap - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body class="aces-v2">

<!-- game-recap.html?gameId=abc123&seasonId=2026-fall: one finished game (js/pages/game-recap.js).
     A game with no result yet opens its preview instead. -->

<main class="gm aces-container" id="main">
  <header class="aces-page-head gm-head">
    <div>
      <span class="aces-page-kicker" id="grKicker">Final</span>
      <h1 class="aces-page-title" id="grTitle">Game Recap</h1>
      <p class="gm-meta" id="grMeta"></p>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
  </div>

  <div data-page-content hidden>
    <div id="grBoard"></div>
    <div class="gm-grid gr-grid">
      <div class="gm-col">
        <div id="grStandouts"></div>
        <div id="grPeter"></div>
      </div>
      <div class="gm-col">
        <div id="grAfter"></div>
      </div>
    </div>
    <div id="grBox"></div>
  </div>
</main>

<script type="module" src="js/pages/game-recap.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
