<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Weekly Pick'em: pick the winner of every Aces game, or call a tie, and climb the season standings.">
<title>Pick'em - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/pickem.css">
</head>
<body class="aces-v2">

<!-- pickem.html: weekly Pick'em, signed-in members (js/pages/pickem.js; scoring in js/domain/pickem.js). -->

<main class="pk aces-container" id="main">
  <header class="aces-page-head">
    <div>
      <span class="aces-page-kicker"><a href="games.html">Games</a></span>
      <h1 class="aces-page-title">Pick'em</h1>
      <p class="pk-desc">Pick the winner of every game, or call a tie. Beat the crowd on an upset for a bonus point.</p>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-card"><span class="aces-skeleton is-row"></span></div>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span></div>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span></div>
  </div>

  <div data-page-content hidden id="pkRoot">
    <nav class="aces-tabs pk-tabs" id="pkTabs" aria-label="Pick'em sections"></nav>
    <div class="pk-week" id="pkWeek"></div>
    <section id="pk-picks"></section>
    <section id="pk-week" hidden></section>
    <section id="pk-season" hidden></section>
    <section id="pk-rules" hidden></section>
  </div>
</main>

<script type="module" src="js/pages/pickem.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
