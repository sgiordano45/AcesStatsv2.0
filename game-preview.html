<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Mountainside Aces game preview: the matchup, Peter's Preview, the tale of the tape, head-to-head history and players to watch.">
<title>Game Preview - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="aces-v2">

<!-- game-preview.html?gameId=abc123 or ?home=Teal&away=Army&date=2026-10-11: one upcoming game (js/pages/game-preview.js). -->

<main class="gm aces-container" id="main">
  <header class="aces-page-head gm-head">
    <div>
      <span class="aces-page-kicker">Game preview</span>
      <h1 class="aces-page-title" id="gpTitle">Game Preview</h1>
      <p class="gm-meta" id="gpMeta"></p>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
  </div>

  <div data-page-content hidden>
    <div id="gpMatchup"></div>
    <div class="gm-grid">
      <div class="gm-col">
        <div id="gpPeter"></div>
        <div id="gpPlayers"></div>
      </div>
      <div class="gm-col">
        <div id="gpTape"></div>
        <div id="gpH2H"></div>
      </div>
    </div>
  </div>
</main>

<script type="module" src="js/pages/game-preview.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
