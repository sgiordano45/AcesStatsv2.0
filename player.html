<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Mountainside Aces player page: batting, pitching, splits, spray chart, badges and awards.">
<title>Player - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/player.css">
</head>
<body class="aces-v2">

<!-- player.html: Batting, Pitching, Splits, Spray, Badges and Awards in one page
     (player.html?id=<id>&tab=pitching). pitcher.html, player-splits.html and
     player_new.html forward here. Code: js/pages/player.js and player-*.js. -->

<div class="aces-container pl-loading" data-page-loading>
  <div class="aces-card pl-head-skel">
    <span class="aces-skeleton is-circle"></span>
    <div class="aces-stack is-tight"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-text"></span></div>
  </div>
  <div class="aces-card"><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
</div>

<main class="player aces-container" id="main" data-page-content hidden>
  <header class="pl-head" id="plHead"></header>

  <nav class="aces-tabs pl-tabs" id="plTabs" aria-label="Player sections"></nav>

  <section data-tab="batting" id="plBatting"></section>
  <section data-tab="pitching" id="plPitching" hidden></section>
  <section data-tab="splits" id="plSplits" hidden></section>
  <section data-tab="spray" id="plSpray" hidden></section>
  <section data-tab="badges" id="plBadges" hidden></section>
  <section data-tab="awards" id="plAwards" hidden></section>

  <nav class="pl-related" id="plRelated" aria-label="See also"></nav>
</main>

<input type="file" id="plPhotoInput" accept="image/*" hidden>

<script type="module" src="js/pages/player.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
