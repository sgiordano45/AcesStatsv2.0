<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Mountainside Aces badges by season: the leaderboard, the team medal table and every badge.">
<title>Trophy Case - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/trophy-case.css">
</head>
<body class="aces-v2">

<!-- trophy-case.html: one season's badges (js/pages/trophy-case.js). A player's own badges are on player.html?tab=badges. -->

<main class="tc aces-container" id="main">
  <header class="aces-page-head tc-head">
    <div>
      <span class="aces-page-kicker">History</span>
      <h1 class="aces-page-title">Trophy Case</h1>
      <p class="tc-desc">Badges earned each season, from 2025 Fall on.</p>
    </div>
    <div class="tc-pick">
      <label class="aces-label" for="tcSeason">Season</label>
      <span class="aces-select-wrap"><select class="aces-select" id="tcSeason"></select></span>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-stats tc-tiles">
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
    </div>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
  </div>

  <div data-page-content hidden>
    <div class="tc-body" id="tcBody" aria-live="polite"></div>
  </div>
</main>

<script type="module" src="js/pages/trophy-case.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
