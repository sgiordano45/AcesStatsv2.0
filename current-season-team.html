<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A Mountainside Aces team this season: record, next game, roster, batting, pitching and schedule.">
<title>Team - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/current-season-team.css">
</head>
<body class="aces-v2">

<!-- current-season-team.html?team=Teal&tab=batting: one team this season (js/pages/current-season-team.js).
     Every season for a team is on team.html. -->

<main class="ct aces-container" id="main">
  <header class="aces-page-head ct-head">
    <div class="ct-id">
      <span class="ct-logo" id="ctLogo"></span>
      <div>
        <span class="aces-page-kicker" id="ctKicker">This season</span>
        <h1 class="aces-page-title" id="ctTitle">Team</h1>
      </div>
    </div>
    <div class="ct-actions" id="ctActions"></div>
  </header>

  <div data-page-loading>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
    <div class="aces-stats ct-summary">
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
    </div>
  </div>

  <div data-page-content hidden>
    <div id="ctHero"></div>
    <div class="aces-stats ct-summary" id="ctStats"></div>
    <nav class="aces-tabs ct-tabs" id="ctTabs" aria-label="Team sections"></nav>
    <div id="ctRoster" hidden></div>
    <div id="ctBatting" hidden></div>
    <div id="ctPitching" hidden></div>
    <div id="ctSchedule" hidden></div>
  </div>
</main>

<script type="module" src="js/pages/current-season-team.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
