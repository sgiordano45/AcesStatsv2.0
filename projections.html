<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Mountainside Aces playoff seeding projections: each team's chance of every seed, a first-round bye and the most likely bracket.">
<title>Projections - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/projections.css">
</head>
<body class="aces-v2">

<!-- projections.html: Monte Carlo seeding projections for the current season (js/pages/projections.js). -->

<main class="pj aces-container" id="main">
  <header class="aces-page-head">
    <div>
      <span class="aces-page-kicker">Playoffs</span>
      <h1 class="aces-page-title" id="pjTitle">Projections</h1>
      <p class="pj-sub">Every team makes the playoffs. These simulations play out the rest of the regular season to show where each team is likely to be seeded.</p>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span></div>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
  </div>

  <div data-page-content hidden>
    <div id="pjControls"></div>
    <div class="aces-stats pj-summary" id="pjStats"></div>
    <section class="aces-card pj-odds">
      <div class="aces-card-head"><h2 class="aces-card-title">Seed odds</h2></div>
      <div id="pjTable"><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
    </section>
    <div class="pj-two">
      <div id="pjBracket"></div>
      <div id="pjRaces"></div>
    </div>
  </div>
</main>

<script type="module" src="js/pages/projections.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
