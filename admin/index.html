<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="../js/core/preview-guard.js"></script>
<link rel="manifest" href="../manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="robots" content="noindex">
<title>Admin - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../mobile-enhancements.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="aces-v2 adm">

<div class="adm-shell aces-container" data-page-content>
  <aside class="adm-side" id="adminSide" aria-label="Admin tools">
    <div class="adm-filter">
      <input class="aces-input" id="adminFilter" type="search" placeholder="Find a tool..." aria-label="Find a tool" autocomplete="off">
    </div>
    <nav id="adminNav"></nav>
  </aside>

  <main class="adm-main" id="main">
    <header class="aces-page-head">
      <div>
        <span class="aces-page-kicker" id="adminWho">Admin</span>
        <h1 class="aces-page-title">Admin</h1>
      </div>
      <button class="aces-btn adm-menu-btn" id="adminMenuBtn" type="button" aria-controls="adminSide">All tools</button>
    </header>

    <h2 class="adm-heading">To do</h2>
    <div class="adm-todos" id="adminTodos">
      <section class="aces-card adm-todo"><p class="adm-hint">Checking games and requests...</p></section>
    </div>

    <h2 class="adm-heading">Site status</h2>
    <section class="aces-card" id="adminStatus"><p class="adm-hint">Loading...</p></section>
  </main>
</div>

<script type="module" src="../js/admin/home.js"></script>
</body>
</html>
