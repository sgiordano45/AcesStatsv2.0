<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="../js/core/preview-guard.js"></script>
<link rel="manifest" href="../manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="robots" content="noindex">
<title>Schedule editor - Admin - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../mobile-enhancements.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/admin-stats.css">
<link rel="stylesheet" href="../css/admin-schedule.css">
</head>
<body class="aces-v2 adm">

<!-- admin/schedule-editor.html: change one game and share the update (js/admin/schedule-editor.js). -->

<div class="adm-shell aces-container" data-page-content>
  <aside class="adm-side" id="adminSide" aria-label="Admin tools">
    <div class="adm-filter">
      <input class="aces-input" id="adminFilter" type="search" placeholder="Find a tool..." aria-label="Find a tool" autocomplete="off">
    </div>
    <nav id="adminNav"></nav>
  </aside>

  <main class="adm-main" id="main">
    <header class="aces-page-head">
      <div>
        <span class="aces-page-kicker" id="adminWho">Admin</span>
        <h1 class="aces-page-title">Schedule editor</h1>
      </div>
      <div class="stp-controls">
        <span class="aces-select-wrap"><select class="aces-select" id="sedSeason" aria-label="Season"></select></span>
        <button class="aces-btn adm-menu-btn" id="adminMenuBtn" type="button" aria-controls="adminSide">All tools</button>
      </div>
    </header>

    <p class="stp-intro">Change one game: date, time, field, teams or status. Saves go live right away. To move several games after a rainout, use <a href="schedule-rework.html">Schedule rework</a>.</p>

    <div class="stp-games-head">
      <h2 class="adm-heading">Games <span class="stp-count" id="sedCount"></span></h2>
      <div class="tr-filters">
        <span class="aces-select-wrap"><select class="aces-select" id="sedTeam" aria-label="Team"></select></span>
        <div class="aces-segmented" role="group" aria-label="Which games">
          <button class="aces-segment" type="button" data-show="upcoming" aria-pressed="true">Upcoming</button>
          <button class="aces-segment" type="button" data-show="postponed" aria-pressed="false">Postponed</button>
          <button class="aces-segment" type="button" data-show="all" aria-pressed="false">All</button>
        </div>
      </div>
    </div>
    <div id="sedList" class="sed-list"></div>

    <section class="aces-card sse-entry" id="sedEditor" hidden>
      <div class="sse-entry-head">
        <div>
          <h2 class="aces-card-title" id="sedTitle"></h2>
          <p class="sse-sub" id="sedNow"></p>
        </div>
        <button class="aces-btn is-sm is-ghost" id="sedClose" type="button">Close</button>
      </div>
      <div class="sed-form">
        <div class="aces-field"><label class="aces-label" for="sedDate">Date</label><input class="aces-input" id="sedDate" type="date"></div>
        <div class="aces-field"><label class="aces-label" for="sedTime">Time</label><input class="aces-input" id="sedTime" type="time" step="300"></div>
        <div class="aces-field sed-wide"><label class="aces-label" for="sedWhere">Field</label><input class="aces-input" id="sedWhere" type="text" list="sedPlaces" autocomplete="off"></div>
        <div class="aces-field"><label class="aces-label" for="sedAway">Away</label><span class="aces-select-wrap"><select class="aces-select" id="sedAway"></select></span></div>
        <div class="sed-swap-cell"><button class="aces-btn is-sm is-ghost" id="sedSwap" type="button" title="Swap home and away">Swap</button></div>
        <div class="aces-field"><label class="aces-label" for="sedHome">Home</label><span class="aces-select-wrap"><select class="aces-select" id="sedHome"></select></span></div>
        <div class="aces-field"><label class="aces-label" for="sedStatus">Status</label><span class="aces-select-wrap"><select class="aces-select" id="sedStatus">
          <option value="scheduled">Scheduled</option><option value="postponed">Postponed</option><option value="cancelled">Cancelled</option><option value="completed">Completed</option>
        </select></span></div>
        <div class="aces-field sed-wide"><label class="aces-label" for="sedNote">Reason <span class="sse-dim">(optional, shown in the update)</span></label><input class="aces-input" id="sedNote" type="text" placeholder="Rain, field conflict..."></div>
      </div>
      <datalist id="sedPlaces"></datalist>
      <label class="agg-check"><input type="checkbox" id="sedLock" checked> <span><strong>Mark as edited by hand</strong> so schedule imports don't overwrite it.</span></label>
      <ul class="tr-checks" id="sedChecks"></ul>
      <div class="sse-actions"><button class="aces-btn is-primary" id="sedSave" type="button">Save changes</button></div>

      <div class="sed-share" id="sedShare" hidden>
        <h3 class="tr-sub">Share the update</h3>
        <textarea class="aces-input sed-msg" id="sedMsg" rows="6"></textarea>
        <div class="sse-actions">
          <a class="aces-btn is-primary" id="sedWa" href="#" target="_blank" rel="noopener">Send in WhatsApp</a>
          <button class="aces-btn" id="sedCopy" type="button">Copy</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script type="module" src="../js/admin/schedule-editor.js"></script>
</body>
</html>
