<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Every Mountainside Aces player, by team or in one sortable table, with career batting lines.">
<title>Players - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/players.css">
</head>
<body class="aces-v2">

<!-- players.html: every player by latest team, or one sortable table (js/pages/players.js). -->

<main class="players aces-container" id="main">
  <header class="aces-page-head">
    <div>
      <span class="aces-page-kicker">Teams &amp; Players</span>
      <h1 class="aces-page-title">Players</h1>
    </div>
  </header>

  <div class="aces-stats ps-summary" id="psSummary" data-page-loading>
    <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
    <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
    <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
    <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
  </div>

  <div data-page-content hidden>
    <div class="aces-stats ps-summary" id="psStats"></div>
    <div class="ps-toolbar" id="psToolbar"></div>
    <div id="psResults"></div>
  </div>

  <div class="ps-skeleton" data-page-loading>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
  </div>
</main>

<script type="module" src="js/pages/players.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
