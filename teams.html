<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Mountainside Aces teams: this season's standings by team, and every team's all-time record and titles.">
<title>Teams - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/teams.css">
</head>
<body class="aces-v2">

<!-- teams.html: this season's teams in standings order, then every team's all-time line (js/pages/teams.js). -->

<main class="teams aces-container" id="main">
  <header class="aces-page-head">
    <div>
      <span class="aces-page-kicker">Teams &amp; Players</span>
      <h1 class="aces-page-title">Teams</h1>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-stats tm-summary">
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
      <div class="aces-stat"><span class="aces-skeleton is-title"></span></div>
    </div>
    <div class="tm-grid">
      <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
      <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
      <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
    </div>
  </div>

  <div data-page-content hidden>
    <div class="aces-stats tm-summary" id="tmStats"></div>
    <section id="tmCurrent"></section>
    <section id="tmAllTime"></section>
  </div>
</main>

<script type="module" src="js/pages/teams.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
