<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Aces games: daily puzzles, Pick'em, DFS and leaderboards for Mountainside Aces members.">
<title>Games - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/games.css">
</head>
<body class="aces-v2">

<!-- games.html: the Play hub - daily puzzles, Pick'em and other league games, leaderboards (js/pages/games.js). -->

<main class="gm aces-container" id="main">
  <header class="aces-page-head gm-head">
    <div>
      <span class="aces-page-kicker">Play</span>
      <h1 class="aces-page-title">Aces Games</h1>
      <p class="gm-desc">Daily puzzles, weekly picks and season-long games for Aces members.</p>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-card"><span class="aces-skeleton is-row"></span></div>
    <div class="gm-grid">
      <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span></div>
      <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span></div>
      <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span></div>
    </div>
  </div>

  <div data-page-content hidden>
    <section class="aces-card gm-today" id="gmToday" aria-live="polite"></section>

    <section class="gm-section" aria-labelledby="gmDailyH">
      <h2 class="gm-h" id="gmDailyH"><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-puzzle"></use></svg>Daily puzzles</h2>
      <p class="gm-sub">A new set every day at midnight.</p>
      <ul class="gm-grid" id="gmDaily"></ul>
    </section>

    <section class="gm-section" aria-labelledby="gmLeagueH">
      <h2 class="gm-h" id="gmLeagueH"><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-trophy"></use></svg>Weekly and season games</h2>
      <ul class="gm-grid" id="gmLeague"></ul>
    </section>

    <section class="gm-section" aria-labelledby="gmBoardsH">
      <h2 class="gm-h" id="gmBoardsH"><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-chart-bar"></use></svg>Leaderboards</h2>
      <ul class="gm-boards" id="gmBoards"></ul>
    </section>

    <section class="gm-section" aria-labelledby="gmSoonH">
      <h2 class="gm-h" id="gmSoonH"><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-sparkles"></use></svg>Coming soon</h2>
      <ul class="gm-grid" id="gmSoon"></ul>
    </section>
  </div>
</main>

<script type="module" src="js/pages/games.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
