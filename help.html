<main class="help aces-container" id="main">

    <div>
      <span class="aces-page-kicker">Help</span>
      <h1 class="aces-page-title">How do I...</h1>
    </div>
  </header>

  <div class="help-search">

      <input class="aces-input" id="helpSearch" type="search" placeholder="RSVP, submit stats, link my player, draft..." autocomplete="off">

  </div>

  <nav class="aces-chip-row help-chips" id="helpChips" aria-label="Guide sections"></nav>

  <div id="helpBody" data-page-content></div>
  <p class="help-empty" id="helpEmpty" hidden>Nothing matches that. Try fewer words, or <a href="feature-submit.html">ask us</a>.</p>
