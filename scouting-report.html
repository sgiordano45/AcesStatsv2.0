<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Mountainside Aces scouting: a printable team report and hitter-versus-team or pitcher matchups.">
<title>Scouting Report - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/scouting.css">
</head>
<body class="aces-v2">

<!-- scouting-report.html: Team report and Matchup tabs (js/pages/scouting.js). Replaces team-scouting-report.html (?tab=team). -->

<main class="sc aces-container" id="main">
  <header class="aces-page-head sc-head">
    <div>
      <span class="aces-page-kicker">Stats</span>
      <h1 class="aces-page-title">Scouting Report</h1>
      <p class="sc-desc">A team's hitters on one page, or how a hitter does against a team or a pitcher.</p>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-card"><span class="aces-skeleton is-row"></span></div>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
  </div>

  <div data-page-content hidden>
    <nav class="aces-tabs sc-tabs" id="scTabs" aria-label="Scouting views"></nav>
    <section class="sc-panel" id="scTeam" hidden></section>
    <section class="sc-panel" id="scMatch" hidden></section>
  </div>
</main>

<script type="module" src="js/pages/scouting.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
