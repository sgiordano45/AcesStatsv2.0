<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Send the Mountainside Aces site an idea, an improvement or a bug report.">
<title>Feedback - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/feature-submit.css">
</head>
<body class="aces-v2">

<!-- feature-submit.html: send feedback; anyone can, signed-in members see their own with status (js/pages/feature-submit.js). Worked on admin/features.html. -->

<main class="fs aces-container" id="main">
  <header class="aces-page-head">
    <div>
      <span class="aces-page-kicker">Help</span>
      <h1 class="aces-page-title">Feedback</h1>
      <p class="fs-desc">An idea, something that could work better, or something broken. Tell us.</p>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
  </div>

  <div data-page-content hidden class="fs-layout">
    <div>
      <form class="aces-card fs-form" id="fsForm" novalidate></form>
      <section class="aces-card fs-done" id="fsDone" hidden aria-live="polite"></section>
    </div>
    <section class="aces-card fs-mine-card" id="fsMine" hidden></section>
  </div>
</main>

<script type="module" src="js/pages/feature-submit.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
