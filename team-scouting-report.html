<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Team Scouting Report - Mountainside Aces</title>
<!-- Retired in v2.0: the team scouting report is now the Team report tab of scouting-report.html. Kept so old links still work. -->
<meta http-equiv="refresh" content="0; url=scouting-report.html?tab=team">
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var out = new URLSearchParams({ tab: 'team' });
    if (q.get('season')) out.set('season', q.get('season'));
    if (q.get('team')) out.set('team', q.get('team'));
    location.replace('scouting-report.html?' + out.toString() + location.hash);
  })();
</script>
</head>
<body>
<p>The team scouting report has moved. <a href="scouting-report.html?tab=team">Go to the new page</a>.</p>
</body>
</html>
