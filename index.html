<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mountainside Aces">
<meta name="description" content="Mountainside Aces softball: live scores, standings, leaders and league news.">

<!-- PWA session restore: reopen the last page if the installed app was closed (within 24 hours). -->
<script>
(function () {
  try {
    var isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (!isPWA || document.referrer) return;
    var lastPage = localStorage.getItem('pwa_last_page');
    var lastTs = parseInt(localStorage.getItem('pwa_last_page_ts') || '0', 10);
    if (lastPage && !/\/(index\.html)?$/.test(lastPage) && (Date.now() - lastTs) < 86400000) {
      window.location.replace(lastPage);
    }
  } catch (e) {}
})();
</script>

<title>Home - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body class="aces-v2">

<main class="home aces-container" id="main">

  <header class="home-head aces-page-head" id="homeHead">
    <div>
      <span class="aces-page-kicker">&nbsp;</span>
      <h1 class="aces-page-title">Mountainside Aces</h1>
    </div>
  </header>

  <!-- Live games, the next games and recent finals -->
  <section class="home-section" id="homeStrip">
    <div class="aces-score-strip home-strip" aria-busy="true">
      <span class="aces-skeleton is-card" style="width:200px"></span>
      <span class="aces-skeleton is-card" style="width:200px"></span>
      <span class="aces-skeleton is-card" style="width:200px"></span>
    </div>
  </section>

  <div class="home-row">
    <section class="aces-card" id="homeStandings" aria-label="Standings">
      <div class="home-skel" aria-busy="true">
        <span class="aces-skeleton is-title"></span>
        <span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span>
        <span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span>
      </div>
    </section>
    <section class="aces-card" id="homeLeaders" aria-label="Leaders">
      <div class="home-skel" aria-busy="true">
        <span class="aces-skeleton is-title"></span>
        <span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span>
        <span class="aces-skeleton is-row"></span>
      </div>
    </section>
  </div>

  <div class="home-row">
    <section class="aces-card" id="homeMine" aria-label="My Aces">
      <div class="home-skel" aria-busy="true"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span></div>
    </section>
    <section class="aces-card" id="homeNews" aria-label="League news">
      <div class="home-skel" aria-busy="true"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
    </section>
  </div>

  <section class="aces-card home-section" id="homeMilestones" aria-label="Milestone watch" hidden></section>

  <section class="home-section" id="homePhotos" hidden></section>

  <section class="home-section" id="homeExplore" aria-label="Explore"></section>

  <p class="home-foot" id="homeFoot"></p>
</main>

<script type="module" src="js/pages/home.js"></script>
<script src="mobile-enhancements.js"></script>
<!-- Offline: queue writes and use cached data when the connection drops. -->
<script src="offline-queue.js"></script>
<script src="firebase-offline-wrapper.js"></script>
</body>
</html>
