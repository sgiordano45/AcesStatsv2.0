<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Every Mountainside Aces champion: the final, the playoff run, the stars and the roster.">
<title>Champions - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/champions.css">
</head>
<body class="aces-v2">

<!-- champions.html: every champion, one season at a time, with the playoff run (js/pages/champions.js). Replaces playoff-history.html. -->

<main class="ch aces-container" id="main">
  <header class="aces-page-head ch-head">
    <div>
      <span class="aces-page-kicker">History</span>
      <h1 class="aces-page-title">Champions</h1>
      <p class="ch-desc">Every Aces champion: the final, the playoff run, the stars and the roster.</p>
    </div>
    <div class="ch-pick">
      <label class="aces-label" for="chSeason">Season</label>
      <span class="aces-select-wrap"><select class="aces-select" id="chSeason"></select></span>
      <a class="aces-btn is-sm is-ghost" href="seasons.html"><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-calendar"></use></svg>Seasons</a>
    </div>
  </header>

  <div data-page-loading>
    <div class="aces-card ch-hero"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span><span class="aces-skeleton is-row"></span></div>
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span></div>
  </div>

  <div data-page-content hidden>
    <div class="ch-body" id="chBody" aria-live="polite"></div>
    <div id="chAllTime"></div>
  </div>
</main>

<script type="module" src="js/pages/champions.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
