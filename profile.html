<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Profile - Mountainside Aces</title>
<!-- Retired in v2.0: The profile page (player and staff accounts) is now me.html. Old links keep working: their
     tab (#tab-player-info, #favorites, ?tab=preferences ...) opens the
     matching Me section. -->
<script>
(function () {
  var MAP = { 'overview': 'dashboard', 'player-info': 'profile', 'favorites': 'favorites', 'preferences': 'notifications',
    'notifications': 'notifications', 'directory': 'directory', 'security': 'account', 'settings': 'account', 'games': 'games' };
  var p = new URLSearchParams(location.search);
  var key = (location.hash || '').replace(/^#(tab-)?/, '') || p.get('tab') || '';
  if (p.get('showSetup')) key = 'notifications';
  var section = MAP[key] || '';
  location.replace('me.html' + (section && section !== 'dashboard' ? '#' + section : ''));
})();
</script>
<meta http-equiv="refresh" content="1; url=me.html">
</head>
<body>
<p>Profile has moved. <a href="me.html">Go to Me</a>.</p>
</body>
</html>
