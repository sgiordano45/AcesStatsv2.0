<!DOCTYPE html>
<html lang="en">
<head>
<script type="module" src="js/core/preview-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2d5016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Mountainside Aces photos, game video, the podcast and the live stream.">
<title>Media - Mountainside Aces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="mobile-enhancements.css">
<link rel="stylesheet" href="css/media.css">
</head>
<body class="aces-v2">

<main class="media aces-container" id="main">
  <header class="aces-page-head">
    <div>
      <span class="aces-page-kicker">History</span>
      <h1 class="aces-page-title">Media</h1>
    </div>
  </header>

  <nav class="aces-tabs media-tabs" id="mediaTabs" aria-label="Media"></nav>

  <section data-tab="photos" id="mediaPhotos">
    <div class="aces-card"><span class="aces-skeleton is-title"></span><span class="aces-skeleton is-row"></span></div>
  </section>
  <section data-tab="video" id="mediaVideo" hidden></section>
  <section data-tab="live" id="mediaLive" hidden></section>
  <section data-tab="upload" id="mediaUpload" hidden></section>
</main>

<!-- Photo and video viewer -->
<dialog class="media-viewer" id="mediaViewer" aria-label="Photo viewer">
  <button type="button" class="media-viewer-btn is-close" data-close aria-label="Close"><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-close"></use></svg></button>
  <button type="button" class="media-viewer-btn is-prev" data-prev aria-label="Previous"><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-chevron-left"></use></svg></button>
  <div class="media-viewer-stage" data-stage></div>
  <button type="button" class="media-viewer-btn is-next" data-next aria-label="Next"><svg class="aces-icon" aria-hidden="true"><use href="icons.svg#icon-chevron-right"></use></svg></button>
  <div class="media-viewer-info" data-info></div>
</dialog>

<script type="module" src="js/pages/media.js"></script>
<script src="mobile-enhancements.js"></script>
</body>
</html>
