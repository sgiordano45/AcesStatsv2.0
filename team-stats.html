<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Team Stats - Mountainside Aces</title>
<!-- Retired in v2.0: Team Stats is now the Team stats tab of teams.html. Kept so old links still work. -->
<meta http-equiv="refresh" content="0; url=teams.html?tab=stats">
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var out = new URLSearchParams({ tab: 'stats' });
    var y = q.get('year'), s = q.get('season');
    if (s && /^\d{4}-/.test(s)) out.set('season', s);
    else if (y && s) out.set('season', y + '-' + s.toLowerCase());
    location.replace('teams.html?' + out.toString() + '#tsTable');
  })();
</script>
</head>
<body>
<p>Team Stats has moved. <a href="teams.html?tab=stats">Go to the new page</a>.</p>
</body>
</html>
